name: fix-nav-type
on:
  push:
    branches: [feat/training-types]
    paths:
      - '.github/workflows/fix-nav-type.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: Patch nav CSS and cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          reps = [
          ('nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,12,15,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:50;padding:4px 2px calc(6px + env(safe-area-inset-bottom))}',
           'nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,12,15,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:50;padding:4px 0 calc(6px + env(safe-area-inset-bottom))}'),
          ('nav.tabs button{flex:1;min-width:0;min-height:48px;background:none;border:none;color:var(--muted);padding:6px 1px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0;line-height:1.15}',
           'nav.tabs button{flex:1;min-width:0;min-height:48px;background:none;border:none;color:var(--muted);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0;line-height:1.15}'),
          ('@media(max-width:360px){nav.tabs button{font-size:8.5px} .disccard .ttl{font-size:18px}}',
           '@media(max-width:360px){nav.tabs button{font-size:10px} .disccard .ttl{font-size:18px}}\n  @media(min-width:375px){nav.tabs button{font-size:11px}}'),
          ]
          for old, new in reps:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'replace mismatch {n} for: {old[:60]}')
              text = text.replace(old, new)
          if 'font-size:8.5px' in text:
              raise SystemExit('8.5px still present')
          p.write_text(text)
          print('patched', p.stat().st_size)
          PY
          rm -f .github/workflows/fix-nav-type.yml
          git add -A
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git commit -m "fix: improve mobile bottom nav readability"
          git push origin feat/training-types
