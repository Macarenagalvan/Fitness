name: apply-hoy
on:
  push:
    branches: [feat/training-types]
    paths:
      - p8-go
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: assemble and apply
        run: |
          python3 assemble-p8.py
          python3 apply-hoy.py
          python3 - <<'PY'
          import hashlib, pathlib, sys
          raw = pathlib.Path("index.html").read_bytes()
          md5 = hashlib.md5(raw).hexdigest()
          print("size", len(raw))
          print("md5", md5)
          if md5 != "1c050bb3040a724a261ba78878d20006":
              sys.exit("MD5 mismatch: "+md5)
          PY
      - name: commit product and cleanup
        run: |
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add daily training recommendations"
          git ls-files | grep -E '^(p8a|p8h|assemble-p8|apply-hoy|hoy-block|i18n-|p8-go)' | xargs -r git rm -f
          git rm -f .github/workflows/apply-hoy.yml || true
          git diff --cached --quiet || git commit -m "chore: remove hoy apply helpers"
          git push
