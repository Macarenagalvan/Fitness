name: align-running
on:
  push:
    branches: [feat/training-types]
    paths:
      - '.github/workflows/align-running.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: Apply alignment and cleanup
        run: |
          python3 align-running.py
          rm -f align-running.py
          rm -f .github/workflows/align-running.yml
          git add -A
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "fix: align running program with source plan"
          git push origin feat/training-types
