name: apply-phase4
on:
  push:
    branches: [feat/training-types]
    paths:
      - phase4-apply.py
      - phase4-a.py
      - phase4-b.py
      - phase4-c.py
      - .github/workflows/apply-phase4.yml
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: Apply Phase 4 navigation
        run: |
          set -e
          if [ ! -f phase4-apply.py ]; then echo "no helper"; exit 0; fi
          python3 phase4-apply.py
          grep -q 'id="v-mas"' index.html
          grep -q 'function navGo' index.html
          grep -q 'forjaTraining_v3' index.html
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          rm -f phase4-apply.py phase4-a.py phase4-b.py phase4-c.py
          rm -f .github/workflows/apply-phase4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "feat: redesign mobile-first training navigation"
          git push
