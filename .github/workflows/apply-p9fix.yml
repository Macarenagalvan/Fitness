name: apply-p9fix
on:
  push:
    branches: [feat/training-types]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'trigger p9fix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text()
          old = 't(w.phase==="walkrun"?"run_ph_walkrun":w.phase==="transition"?"run_ph_trans":w.phase==="k5"?"run_ph_5k":"run_ph_10k")'
          new = 'runPhaseLabel(w.phase)'
          n = t.count(old)
          if n != 1:
              raise SystemExit(f'FAIL phase count={n}')
          t = t.replace(old, new)
          old2 = 'const legacy=(DB.yogaLogs||[]).length;'
          new2 = 'const legacy=(DB.yogaLogs||[]).filter(x=>x&&x.source!=="prog").length;'
          n2 = t.count(old2)
          if n2 != 1:
              raise SystemExit(f'FAIL legacy count={n2}')
          t = t.replace(old2, new2)
          if 'run_ph_10k' in t:
              raise SystemExit('FAIL run_ph_10k remains')
          if old2 in t:
              raise SystemExit('FAIL old legacy remains')
          p.write_text(t)
          print('ok', p.stat().st_size)
          PY
      - name: commit product and cleanup
        run: |
          git config user.name Macarenagalvan
          git config user.email 79223918+Macarenagalvan@users.noreply.github.com
          git add index.html
          git commit -m "fix: correct running phase and yoga legacy counts"
          rm -f p9fix-go .github/workflows/apply-p9fix.yml
          git add -A
          git commit -m "chore: remove p9fix helpers"
          git push
