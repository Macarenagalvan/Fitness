name: apply-yoga
on:
  workflow_dispatch:
  push:
    branches: [feat/training-types]
    paths:
      - yoga-block.js.b64.29
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
