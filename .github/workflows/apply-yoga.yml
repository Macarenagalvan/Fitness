name: apply-yoga
on:
  workflow_dispatch:
  push:
    branches: [feat/training-types]
    paths:
      - yoga-block.js.b64.7
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: decode and apply
        run: |
          python3 decode-and-apply.py
          python3 apply-yoga.py
      - name: commit index
        run: |
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add 24-week progressive yoga program"
          git rm -f apply-yoga.py apply-yoga.py.b64 yoga-block.js yoga-block.js.b64 yoga-block.js.b64.a yoga-block.js.b64.b yoga-block.js.b64.0 yoga-block.js.b64.1 yoga-block.js.b64.2 yoga-block.js.b64.3 yoga-block.js.b64.4 yoga-block.js.b64.5 yoga-block.js.b64.6 yoga-block.js.b64.7 i18n-yoga.txt i18n-yoga.txt.b64 i18n-yoga.txt.b64.0 i18n-yoga.txt.b64.1 decode-and-apply.py .github/workflows/apply-yoga.yml || true
          git diff --cached --quiet || git commit -m "chore: remove yoga apply helpers"
          git push
