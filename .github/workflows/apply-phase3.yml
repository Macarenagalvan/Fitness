name: apply-phase3
on:
  push:
    branches: [feat/training-types]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
          fetch-depth: 0
      - name: Insert SeqTimer into index.html
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          html_path = Path('index.html')
          s = html_path.read_text(encoding='utf-8')
          marker = '/* ===== CRONÓMETRO DE DESCANSO ===== */'
          if 'function seqStart' in s:
              print('already applied')
          else:
              engine = Path('phase3-engine.js').read_text(encoding='utf-8').rstrip() + '\n\n'
              assert s.count(marker) == 1, 'marker'
              s = s.replace(marker, engine + marker)
              html_path.write_text(s, encoding='utf-8')
              print('inserted', len(engine))
          PY
          rm -f phase3-engine.js .github/workflows/apply-phase3.yml
          git add -A
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "feat: add reusable sequence timer engine"
          git push origin feat/training-types
