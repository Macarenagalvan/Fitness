name: apply-phase5
on:
  push:
    branches: [feat/training-types]
    paths:
      - '.github/workflows/apply-phase5.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: Apply Phase 5 and cleanup
        run: |
          python3 apply.py
          rm -f apply.py i18n-es.txt i18n-de.txt running-block-a.js running-block-b.js running-block-c.js running-block-c.b64 running-block.js phase5-apply.py
          rm -f .github/workflows/apply-phase5.yml
          git add -A
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "feat: add complete 24-week running program"
          git push origin feat/training-types
