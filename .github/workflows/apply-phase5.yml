name: apply-phase5
on:
  push:
    branches: [feat/training-types]
    paths:
      - '.github/workflows/apply-phase5.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: Apply Phase 5 and cleanup
        run: |
          python3 phase5-apply.py
          rm -f phase5-apply.py
          rm -f .github/workflows/apply-phase5.yml
          git add -A
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git commit -m "feat: add complete 24-week running program"
          git push origin feat/training-types
