name: apply-phase1
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
          fetch-depth: 0
      - name: Rebuild Phase 1 index.html from main + patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > index.html
          git apply --whitespace=nowarn phase1-session-types.patch
          rm -f phase1-session-types.patch
          rm -f .github/workflows/apply-phase1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git commit -m "feat: add backward-compatible training session types"
          git push origin HEAD:feat/training-types
