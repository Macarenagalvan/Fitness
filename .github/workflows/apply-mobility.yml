name: apply-mobility
on:
  workflow_dispatch:
  push:
    branches: [feat/training-types]
    paths:
      - mobility-block.js
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: apply mobility
        run: python3 apply-mobility.py
      - name: commit product and cleanup
        run: |
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add mobility and recovery presets"
          git rm -f apply-mobility.py mobility-block.js i18n-es.txt i18n-de.txt probe.txt .github/workflows/apply-mobility.yml || true
          git diff --cached --quiet || git commit -m "chore: remove mobility apply helpers"
          git push
