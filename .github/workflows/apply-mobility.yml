name: apply-mobility
on:
  push:
    branches: [feat/training-types]
    paths:
      - p7-go
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/training-types
      - name: assemble apply and block
        run: python3 assemble-p7.py
      - name: apply and verify
        run: |
          python3 apply-mobility.py
          python3 - <<'PY'
          import hashlib, pathlib, sys
          raw = pathlib.Path("index.html").read_bytes()
          md5 = hashlib.md5(raw).hexdigest()
          print("size", len(raw))
          print("md5", md5)
          if md5 != "7f652397bd770c27b0230f1bea2df822":
              sys.exit("MD5 mismatch: "+md5)
          PY
      - name: commit product and cleanup
        run: |
          git config user.name "Macarenagalvan"
          git config user.email "79223918+Macarenagalvan@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add mobility and recovery presets"
          git ls-files | grep -E '^(p7a|p7m|assemble-p7|apply-mobility|mobility-block|i18n-|p7-go)' | xargs -r git rm -f
          git rm -f .github/workflows/apply-mobility.yml || true
          git diff --cached --quiet || git commit -m "chore: remove mobility apply helpers"
          git push
