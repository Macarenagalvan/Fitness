 p.history.push(entry); p.lastRunAt=today();
 p.completedSessions.push({week:entry.week,sessionId:entry.sessionId,date:entry.date,repeat:!!entry.repeat,optional:!!s.optional});
 if(completed) p.jogSec=(p.jogSec||0)+runWorkSec(s);
 runUnlockAchievements(entry);
 let msg="";
 if(!s.optional){
  const reqLogs=runRequiredLogs(entry.week);
  if(reqLogs.length>=runRequired(entry.week).length){
   const decision=runDecision(reqLogs);
   p.lastDecision=decision;
   if(decision==="advance"&&p.week<24){ p.week=p.week+1; msg=t("run_adv_ok",{n:p.week}); }
   else if(decision==="pain") msg=t("run_pain_msg");
   else msg=t("run_rep_msg");
  }
 }
 save();
 if(seqTimer.active||seqTimer.paused) seqCancel();
 runClearLive();

 renderRunning();
}

function seqRestore(snap,cbs){
 seqReset();
 if(!snap||!snap.steps||!snap.steps.length) return false;
 seqTimer.steps=snap.steps.slice();
 seqTimer._cbs=cbs||{};
 seqTimer.stepIndex=Math.max(0,Math.min(snap.stepIndex||0,seqTimer.steps.length-1));
 seqTimer._elapsedBefore=0;
 for(let i=0;i<seqTimer.stepIndex;i++) seqTimer._elapsedBefore+=(+(seqTimer.steps[i].sec)||0)*1000;
 seqTimer.active=true; seqTimer._done=false;
 const rem=Math.max(0,+snap.remainingMs||0);
 const st=seqCurrent(), dur=st?((+st.sec||0)*1000):0;
 seqTimer.elapsedMs=seqTimer._elapsedBefore+Math.max(0,dur-rem);
 if(snap.paused){
  seqTimer.paused=true; seqTimer.remainingMs=rem; seqTimer.startedAt=0; seqTimer.targetEnd=0;
  if(seqTimer._cbs.onStep) seqTimer._cbs.onStep(st,seqTimer.stepIndex,seqNext());
  return true;
 }
 seqTimer.paused=false; seqTimer.startedAt=seqNow(); seqTimer.targetEnd=seqTimer.startedAt+rem; seqTimer.remainingMs=rem;
 if(seqTimer._cbs.onStep) seqTimer._cbs.onStep(st,seqTimer.stepIndex,seqNext());
 seqPulse(); seqSync(); return true;
}

function ensureYogaDB(d){

  d.programs.yoga={week:1,completedSessions:[],history:[],startedAt:null,lastDecision:null,lastYogaAt:null,poses:{},poseCount:{}};
 }else{
  if(!(y.week>=1&&y.week<=24)) y.week=1;
  if(!Array.isArray(y.completedSessions)) y.completedSessions=[];
  if(!Array.isArray(y.history)) y.history=[];
  if(!y.poses||typeof y.poses!=="object") y.poses={};
  if(!y.poseCount||typeof y.poseCount!=="object") y.poseCount={};
 }
 if(d.yogaSession===undefined) d.yogaSession=null;
 if(!Array.isArray(d.yogaAchievements)) d.yogaAchievements=[];
 if(!Array.isArray(d.yogaLogs)) d.yogaLogs=[];

}

function yogaBuildSteps(week,sid,short){

}

 else if(st.mode==="breaths") core=t("mob_dose_breaths",{n:st.breaths});

 if(!mobLive||!st||st.mode!=="time") return;
 if(mobLive.remain==null) mobLive.remain=st.sec;

  mobLive.remain--;

 let pend="";
 if(isCur){
  const run=nextRunningSession();
  const yg=nextYogaSession();
  const stGoal=(DB.settings&&DB.settings.weeklyGoal)||3;
  const stHave=weekStrengthCount();
  const rows=[];
  if(run&&!run.done) rows.push(t("hoy_type_run")+" · "+t("hoy_sub_run",{w:run.week,n:runSessNum(run.session&&run.session.id)}));
  if(yg&&!yg.done) rows.push(t("hoy_type_yg")+" · "+t("hoy_sub_yg",{w:yg.week,n:runSessNum(yg.session&&yg.session.id)}));
  if(stHave<stGoal) rows.push(t("hoy_type_str")+" · "+t("wk_str_left",{n:stGoal-stHave,g:stGoal}));
  pend=`<h2 class="sec">${esc(t("wk_pending"))}</h2>`+(rows.length?rows.map(r=>`<div class="wkpend">${esc(r)}</div>`).join(""):`<div class="empty">${esc(t("wk_pending_none"))}</div>`);
 }
 const counts=isCur?weekMiniCounts():{
  stHave:weekLogsByType("strength",ws).length, stGoal:null,
  runHave:weekLogsByType("running",ws).filter(l=>!l.optional&&!l.repeat).length, runNeed:null,
  ygHave:weekLogsByType("yoga",ws).filter(l=>!l.optional&&!l.repeat).length, ygNeed:null,
  mobHave:weekLogsByType("mobility",ws).length
 };
 const cell=(lab,have,need)=>`<div><span>${esc(lab)}</span><b>${need==null?have:have+" / "+need}</b></div>`;
 box.innerHTML=`<div class="wknav">
   <button class="btn ghost wkarr" onclick="wkShift(-1)">‹</button>
   <div class="wktitle" onclick="wkGoToday()"><div class="kick">${esc(isCur?t("wk_this"):t("wk_other"))}</div><div class="wkrange">${esc(weekRangeLabel(ws))}</div></div>
   <button class="btn ghost wkarr" onclick="wkShift(1)">›</button>
  </div>
  <div class="wkdays">${dayHtml}</div>
  ${pend}
  <div class="hoyweek wktotals">
   ${cell(t("hoy_week_str"),counts.stHave,counts.stGoal)}
   ${cell(t("hoy_week_run"),counts.runHave,counts.runNeed)}
   ${cell(t("hoy_week_yg"),counts.ygHave,counts.ygNeed)}
   ${cell(t("hoy_week_mob"),counts.mobHave,null)}
  </div>`;
}
function setProgPane(p){ progPane=p; renderProgreso(); }
function renderProgTabs(){
 const box=document.getElementById("progTabs"); if(!box) return;
 const tabs=[["strength","hoy_type_str"],["running","hoy_type_run"],["yoga","hoy_type_yg"],["mobility","hoy_type_mob"]];
 box.innerHTML=tabs.map(([id,k])=>`<button class="${progPane===id?"on":""}" onclick="setProgPane('${id}')">${esc(t(k))}</button>`).join("");
}
function achMap(list){ const m={}; (list||[]).forEach(a=>m[a.id]=a); return m; }
function renderAchList(defs, have){
 const map=achMap(have);
 return `<div class="achgrid">`+defs.map(([id,key])=>{
  const got=map[id];
  return `<div class="ach ${got?"on":""}"><div class="achmark">${got?"✓":"○"}</div><div><div class="achnm">${esc(t(key))}</div><div class="achdt">${got&&got.date?esc(got.date):esc(t("pg_locked"))}</div></div></div>`;
 }).join("")+`</div>`;
}
function renderProgRunning(){
 const box=document.getElementById("progRunning"); if(!box) return;
 ensureRunningDB(DB);
 const p=runProg(); const w=runWeekDef(p.week);
 const logs=logsByType("running");
 const done=logs.filter(l=>l.completed!==false);
 const mins=done.reduce((a,l)=>a+(+l.durMin||0),0);
 const kms=done.map(l=>+l.km).filter(n=>n>0);
 const maxKm=kms.length?Math.max.apply(null,kms):null;
 const rpes=done.filter(l=>+l.rpe>0).slice(-5).map(l=>+l.rpe);
 const rpeAvg=rpes.length?(rpes.reduce((a,b)=>a+b,0)/rpes.length):null;
 const cur=weekMiniCounts();
 let block="—";
 let blockOk=false;
 done.forEach(l=>{
  const s=runSessDef(l.week,l.sessionId);
  if(s&&s.workSec){ blockOk=true; if(s.workSec> (parseInt(block,10)||0)) block=s.workSec+" s"; }
 });
 if(!blockOk) block=t("pg_block_na");
 const empty=logs.length?"":`<div class="empty">${esc(t("pg_run_empty"))}</div>`;
 box.innerHTML=`${empty}
  <div class="grid3">
   <div class="stat"><div class="num">${p.week||1}/24</div><div class="lbl">${esc(t("pg_week_of"))}</div></div>
   <div class="stat"><div class="num">${done.length}</div><div class="lbl">${esc(t("pg_sessions"))}</div></div>
   <div class="stat"><div class="num">${mins||"—"}</div><div class="lbl">${esc(t("pg_minutes"))}</div></div>
  </div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_phase"))}</div><div>${esc(runPhaseLabel(w.phase))}</div></div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_block"))}</div><div>${esc(block)}</div></div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_maxkm"))}</div><div>${maxKm==null?esc(t("pg_nokm")):maxKm+" km"}</div></div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_rpe"))}</div><div>${rpeAvg==null?esc(t("pg_norpe")):rpeAvg.toFixed(1)}</div></div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_week_now"))}</div><div>${cur.runHave} / ${cur.runNeed}</div></div>
  <h2 class="sec">${esc(t("pg_ach_run"))}</h2>
  ${renderAchList(RUN_ACH, DB.runningAchievements)}`;
}
function renderProgYoga(){
 const box=document.getElementById("progYoga"); if(!box) return;
 ensureYogaDB(DB);
 const p=yogaProg(); const w=yogaWeekDef(p.week);
 const logs=logsByType("yoga");
 const hist=p.history||[];
 const legacy=(DB.yogaLogs||[]).filter(x=>x&&x.source!=="prog").length;
 const poses=p.poses||{};
 const learned=Object.keys(poses).filter(k=>poses[k]==="learned").length;
 const learning=Object.keys(poses).filter(k=>poses[k]==="learning").length;
 const total=typeof YOGA_POSES!=="undefined"?YOGA_POSES.length:19;
 const durs=hist.map(h=>+h.durMin||0).concat(logs.map(l=>+l.durMin||0)).filter(n=>n>0);
 const longest=durs.length?Math.max.apply(null,durs):null;
 const cur=weekMiniCounts();
 const empty=hist.length||logs.length?"":`<div class="empty">${esc(t("pg_yg_empty"))}</div>`;
 box.innerHTML=`${empty}
  <div class="grid3">
   <div class="stat"><div class="num">${p.week||1}/24</div><div class="lbl">${esc(t("pg_week_of"))}</div></div>
   <div class="stat"><div class="num">${hist.length}</div><div class="lbl">${esc(t("pg_yg_new"))}</div></div>
   <div class="stat"><div class="num">${legacy||"—"}</div><div class="lbl">${esc(t("pg_yg_legacy"))}</div></div>
  </div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_poses"))}</div><div>${t("pg_learned")}: ${learned} / ${total} · ${t("pg_learning")}: ${learning}</div></div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_longest"))}</div><div>${longest==null?esc(t("pg_nolong")):longest+" min"}</div></div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_week_now"))}</div><div>${cur.ygHave} / ${cur.ygNeed}</div></div>
  <h2 class="sec">${esc(t("pg_ach_yg"))}</h2>
  ${renderAchList(YG_ACH, DB.yogaAchievements)}`;
}
function renderProgMobility(){
 const box=document.getElementById("progMobility"); if(!box) return;
 const logs=logsByType("mobility");
 const wk=weekLogsByType("mobility", weekStart(today()));
 const last=logs.length?logs[logs.length-1]:null;
 const used={};
 logs.forEach(l=>{ if(l.presetId) used[l.presetId]=(used[l.presetId]||0)+1; });
 let top=null, topN=0;
 Object.keys(used).forEach(k=>{ if(used[k]>topN){ top=k; topN=used[k]; } });
 const p=top&&typeof mobPreset==="function"?mobPreset(top):null;
 const topLab=p?t(p.nameKey):(top||"—");
 box.innerHTML=`
  <div class="grid3">
   <div class="stat"><div class="num">${logs.length}</div><div class="lbl">${esc(t("pg_mob_total"))}</div></div>
   <div class="stat"><div class="num">${wk.length}</div><div class="lbl">${esc(t("pg_mob_week"))}</div></div>
   <div class="stat"><div class="num">${top?topLab:"—"}</div><div class="lbl">${esc(t("pg_mob_top"))}</div></div>
  </div>
  <div class="card tight"><div class="xs muted">${esc(t("pg_mob_last"))}</div><div>${last?esc(last.date+(last.presetId?" · "+(p&&last.presetId===top?topLab:last.presetId):"")):esc(t("pg_mob_empty"))}</div></div>`;
}
function renderProgStrengthExtras(){
 const sow=startOfWeek();
 const elW=document.getElementById("stWeek");
 if(elW) elW.textContent=strengthLogs().filter(l=>new Date(l.date+"T00:00:00")>=sow).length;
 const elT=document.getElementById("stTotal"); if(elT) elT.textContent=strengthLogs().length;
 const elS=document.getElementById("stStreak"); if(elS) elS.textContent=computeStreak().streak;
 if(typeof renderStreak==="function") renderStreak();
 if(typeof renderMedals==="function") renderMedals();
 if(typeof renderWeekSummary==="function") renderWeekSummary();
 if(typeof renderConsistency==="function") renderConsistency();
}


/* ===== PWA ===== */
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
 });
}

/* ===== INIT ===== */
if((DB.medalsSeen||[]).length===0 && strengthLogs().length>0){ DB.medalsSeen=earnedIds(); save(); }
applyStatic();
go("inicio");
if(!DB.onboarded)openOnboarding();
</script>
