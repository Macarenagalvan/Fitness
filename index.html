<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORJA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23caff00'/%3E%3Cg stroke='%230b0c0f' stroke-width='8' stroke-linecap='round'%3E%3Cpath d='M30 30l40 40'/%3E%3Cpath d='M22 22l16 16M62 62l16 16'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="description" content="FORJA · Fuerza, running, yoga y movilidad en una sola app personal.">
<title>FORJA</title>
<style>
  :root{
    --bg:#0b0c0f; --bg-grad:radial-gradient(120% 80% at 50% -10%,#16181f 0%,#0b0c0f 60%);
    --surface:#15171d; --surface2:#1d2027; --line:#2a2e38;
    --txt:#f3f5f8; --muted:#878f9e;
    --volt:#caff00; --coral:#ff5a36; --blue:#3da5ff; --pink:#ff4d8d; --amber:#ffb020; --green:#39d98a;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--txt);line-height:1.4;padding-bottom:calc(92px + env(safe-area-inset-bottom));font-size:16px;font-weight:500}
  .display{font-family:Impact,Impact,sans-serif;letter-spacing:1px;font-weight:400}
  .wrap{max-width:580px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 15px 0}
  .ic{display:inline-flex;align-items:center}
  .ic svg{width:18px;height:18px}
  .logo svg{width:22px;height:22px}
  h2.sec .ic svg{width:20px;height:20px}
  .badge svg{width:13px;height:13px}
  #nameEdit svg{width:15px;height:15px}
  header.app{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
  header.app>div:last-child>.btn.mini{min-width:44px;min-height:44px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:38px;height:38px;display:grid;place-items:center;background:var(--volt);border-radius:11px;color:#0b0c0f;transform:rotate(-6deg)}
  .brand h1{font-family:Impact,sans-serif;font-size:26px;margin:0;letter-spacing:2px;line-height:1}
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:.3px;text-transform:none;margin-top:2px}
  .lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .lang button{min-height:44px;background:transparent;color:var(--muted);border:none;padding:7px 11px;font-family:system-ui;font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer}
  .lang button.on{background:var(--volt);color:#0b0c0f}
  h2.sec{font-family:Impact,sans-serif;font-size:19px;letter-spacing:2px;margin:22px 2px 11px;display:flex;align-items:center;gap:8px}
  h2.sec .ic{color:var(--volt)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card.tight{padding:13px}
  .row{display:flex;gap:10px}.row.between{justify-content:space-between;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 10px;text-align:center;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--volt)}
  .stat .num{font-family:Impact,sans-serif;font-size:34px;line-height:1;color:var(--volt)}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12px}
  button{font-family:system-ui,sans-serif;cursor:pointer;border:none;border-radius:13px;font-size:16px;font-weight:600}
  .btn{background:var(--volt);color:#0b0c0f;font-weight:700;padding:14px 16px;width:100%;border-radius:14px;text-transform:uppercase;letter-spacing:1px;transition:.12s;display:flex;align-items:center;justify-content:center;gap:9px}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--surface2);color:var(--txt);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);text-transform:none;letter-spacing:.5px}
  .btn.danger{background:transparent;color:var(--coral);border:1px solid #4a2a23;text-transform:none}
  .btn.mini{width:auto;padding:9px 13px;font-size:13px}
  .btn .ic svg{width:18px;height:18px}
  input,select,textarea{font-family:system-ui,sans-serif;font-size:16px;font-weight:600;background:#0e1014;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--volt)}
  textarea{resize:vertical;min-height:66px}
  label.fld{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 3px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .pill{min-height:44px;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  .pill.on{background:rgba(202,255,0,.16);border-color:var(--volt);color:var(--volt)}
  .pill.amber.on{background:rgba(255,176,32,.16);border-color:var(--amber);color:var(--amber)}
  .pill.red.on{background:rgba(255,90,54,.16);border-color:var(--coral);color:var(--coral)}
  .pill.blue.on{background:rgba(61,165,255,.16);border-color:var(--blue);color:var(--blue)}
  .pill.pink.on{background:rgba(255,77,141,.16);border-color:var(--pink);color:var(--pink)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
  .badge.up{background:rgba(202,255,0,.16);color:var(--volt)}
  .badge.hold{background:rgba(61,165,255,.16);color:var(--blue)}
  .badge.new{background:rgba(255,176,32,.16);color:var(--amber)}
  .badge.down{background:rgba(255,90,54,.16);color:var(--coral)}
  .ex{border-top:1px solid var(--line);padding:11px 0}
  .ex:first-of-type{border-top:none}
  .ex .name{font-weight:700;font-size:16px}
  .ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .ex .howto{font-size:12.5px;color:var(--muted);margin-top:3px;font-style:italic}
  .secblock{margin-bottom:12px}
  .sechead{display:flex;align-items:center;gap:9px;margin:16px 2px 8px}
  .sechead .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
  .sechead .dot svg{width:17px;height:17px}
  .sechead .t{font-family:Impact,sans-serif;font-size:18px;letter-spacing:1.5px}
  .sechead .c{font-size:11px;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.5px}
  .daytab{padding:10px 13px;border-radius:12px;font-size:13px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
  .daytab.on{background:var(--volt);border-color:var(--volt);color:#0b0c0f}
  .scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .scrollx::-webkit-scrollbar{display:none}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,12,15,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:50;padding:4px 0 calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;min-width:0;min-height:48px;background:none;border:none;color:var(--muted);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0;line-height:1.15}
  nav.tabs button.on{color:var(--volt)}
  nav.tabs svg{width:22px;height:22px;flex:none}
  nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .view{display:none;animation:fade .22s}.view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .empty{color:var(--muted);text-align:center;padding:24px 12px;font-size:15px}
  .note{background:#0e1014;border:1px solid var(--line);border-left:3px solid var(--volt);border-radius:12px;padding:12px 13px;font-size:14px;color:var(--muted)}
  .hero{background:linear-gradient(120deg,#1a1d25,#121419);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;margin-bottom:12px}
  .hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:radial-gradient(circle,rgba(202,255,0,.14),transparent 70%)}
  .hero .ic{color:var(--volt)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .modal-bg.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:580px;padding:20px 16px 28px;max-height:90vh;overflow:auto}
  .modal h3{font-family:Impact,sans-serif;font-size:24px;letter-spacing:1.5px;margin:2px 0 14px}
  .tag-chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--surface2);color:var(--muted);margin:0 5px 5px 0;text-transform:uppercase;letter-spacing:.5px}
  .spark{width:100%;display:block}
  .libitem{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0}
  .libitem:first-child{border-top:none}
  .libitem .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
  .libitem .ico svg{width:19px;height:19px}
  .libitem .nm{font-weight:700}
  .libitem .mu{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .libitem .ht{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:2px}
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .photo-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .photo-cell{position:relative}
  .photo-cell .cap{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cmp .lab{font-family:Impact,sans-serif;letter-spacing:1px;font-size:15px;color:var(--volt);margin-bottom:5px;text-align:center}
  .cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .swatch-up{color:var(--volt)}.swatch-hold{color:var(--blue)}
  #restBar{display:none;position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;justify-content:center;padding:0 12px}
  #restBar .inner{max-width:556px;width:100%;background:var(--volt);color:#0b0c0f;border-radius:14px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #restBar .tm{font-family:Impact,sans-serif;font-size:24px;letter-spacing:1px;line-height:1}
  #restBar .lb{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:1px}
  #restBar button{background:rgba(0,0,0,.14);color:#0b0c0f;border-radius:9px;padding:8px 11px;font-weight:700;font-size:13px}
  #restBar button.k{background:#0b0c0f;color:var(--volt)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{min-height:44px;flex:1;min-width:54px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 4px;font-weight:700;font-size:13px}
  .seg button.on{background:var(--volt);border-color:var(--volt);color:#0b0c0f}
  .ring-wrap{display:flex;align-items:center;gap:14px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{font-size:9px;color:var(--muted);text-align:center;text-transform:uppercase;font-weight:700;padding-bottom:2px}
  .cal .cell{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);background:#0e1014}
  .cal .cell.out{opacity:0}
  .cal .cell.train{background:var(--volt);color:#0b0c0f}
  .cal .cell.period{background:rgba(255,77,141,.28);color:var(--pink)}
  .cal .cell.pred{border:1px dashed var(--pink);color:var(--pink);background:transparent}
  .cal .cell.today{outline:2px solid var(--blue);outline-offset:-2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .rate{display:flex;gap:6px}
  .rate button{min-height:44px;flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 0;font-weight:700}
  .rate button.on{background:var(--volt);border-color:var(--volt);color:#0b0c0f}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .medal{text-align:center;opacity:.5;cursor:pointer}
  .medal.on{opacity:1}
  .mic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto}
  .mic svg{width:26px;height:26px}
  .mn{font-size:12px;font-weight:700;margin-top:6px;line-height:1.15}
  .mp{font-size:11px;color:var(--muted)}
  .mach{font-size:12.5px;color:var(--blue);margin-top:4px;display:flex;align-items:center;gap:5px}
  .mach svg{width:14px;height:14px;flex:none}
  .dgbox{background:#0e1014;border:1px solid var(--line);border-radius:12px;padding:6px}
  .dgbox svg{width:100%;height:auto;display:block}
  .hub{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:14px auto 0}
  .bub{position:absolute;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;cursor:pointer;transition:.12s;background:var(--surface);border:1px solid var(--line)}
  .bub:active{transform:scale(.93)}
  .bub .bi{display:grid;place-items:center}
  .bub .bi svg{width:26px;height:26px;color:var(--volt)}
  .bub .bl{font-size:12px;font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt);padding:0 6px;line-height:1.1}
  .bub.small{width:27%}
  .bub.center{width:39%;left:30.5%;top:30.5%;background:var(--volt);border-color:var(--volt);box-shadow:0 0 0 7px rgba(202,255,0,.12)}
  .bub.center .bi svg{width:40px;height:40px;color:#0b0c0f}
  .bub.center .bl{font-family:Impact,sans-serif;font-size:21px;letter-spacing:1.5px;color:#0b0c0f;margin-top:2px}
  .hubhint{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
  /* --- Tarjeta HOY --- */
  .todaycard{background:linear-gradient(120deg,#1c2029,#121419);border:1px solid var(--line);border-radius:var(--r);padding:17px;position:relative;overflow:hidden}
  .todaycard::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:radial-gradient(circle,rgba(202,255,0,.13),transparent 70%);pointer-events:none}
  .todaycard .kick{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .todaycard .dayname{font-family:Impact,sans-serif;font-size:30px;letter-spacing:1px;line-height:1.05;margin-top:3px}
  .todaycard .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .todaycard .tip{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.35}
  .todaycard .btn{margin-top:13px}

.hoycard{max-width:100%;overflow-x:hidden}
.hoycard .dayname{font-size:28px;overflow-wrap:anywhere}
.hoysub{color:var(--volt);font-weight:800;margin-top:6px;font-size:15px}
.hoyload{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700}
.hoydot{width:10px;height:10px;border-radius:50%;flex:none;background:#7dce7a}
.hoydot.med{background:#e6c35c}
.hoydot.high{background:#e08a3c}
.hoywhy{color:var(--muted);font-size:13px;line-height:1.35;margin-top:6px}
.hoycta{margin-top:13px;width:100%;min-height:44px}
.hoyalts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.hoyalt{width:100%;min-height:44px}
.hoyweek{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}

.wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wkarr{flex:0 0 44px;width:44px!important;min-width:44px;min-height:44px;padding:0}
.wktitle{flex:1;min-width:0;text-align:center}
.wkrange{font-weight:800;font-size:16px}
.wkdays{display:flex;flex-direction:column;gap:8px}
.wkday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wkday.today{border-color:var(--volt)}
.wkhd{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.wkitem{padding:6px 0;border-top:1px solid var(--line)}
.wkitem:first-of-type{border-top:0;padding-top:0}
.wknm{font-weight:800;font-size:14px;overflow-wrap:anywhere}
.wkmt{color:var(--muted);font-size:12px}
.wkempty{color:var(--muted);font-size:13px}
.wkpend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;font-weight:700}
.wktotals{margin-top:12px}
.achgrid{display:grid;grid-template-columns:1fr;gap:8px}
.ach{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.ach.on{border-color:var(--volt)}
.achmark{font-size:18px;width:22px;flex:none}
.achnm{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.achdt{color:var(--muted);font-size:12px}
#progTabs{margin-bottom:12px}
#progTabs button{min-height:44px}
@media(min-width:430px){.achgrid{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.wkrange{font-size:14px}.stat .num{font-size:18px}}

.hoyweek div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.hoyweek span{color:var(--muted)}
.hoyweek b{font-variant-numeric:tabular-nums}
@media(max-width:360px){
 .hoycard .dayname{font-size:24px}
 .hoysub{font-size:14px}
 .hoyweek{grid-template-columns:1fr}
}

  /* --- Series (contador visual) --- */
  .sets{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
  .setdot{width:38px;height:38px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none;transition:.12s}
  .setdot.on{background:var(--volt);border-color:var(--volt);color:#0b0c0f}
  .setdot:active{transform:scale(.9)}
  .setcount{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-left:2px}
  .setlbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;width:100%;margin-bottom:-3px}
  /* --- RIR / RPE --- */
  .seg.tiny button{min-width:38px;padding:8px 2px;font-size:13px}
  .lastline{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
  .lastline b{color:var(--txt);font-weight:700}
  /* --- Timer inline (holds / cardio) --- */
  .itimer{display:flex;align-items:center;gap:9px;margin-top:9px;background:#0e1014;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .itimer .tv{font-family:Impact,sans-serif;font-size:24px;letter-spacing:1px;line-height:1;min-width:62px}
  .itimer .tv.run{color:var(--volt)}
  .itimer button{background:var(--surface2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
  .itimer button.go{background:var(--volt);border-color:var(--volt);color:#0b0c0f}
  /* --- Volumen por sección --- */
  .volrow{margin:9px 0}
  .volbar{height:9px;background:#0e1014;border-radius:6px;overflow:hidden;margin-top:3px}
  .volbar i{display:block;height:100%;border-radius:6px}
  /* --- Reordenar --- */
  .ordbtns{display:flex;flex-direction:column;gap:3px;flex:none}
  .ordbtns button{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:8px;width:32px;height:24px;display:grid;place-items:center;padding:0}
  .ordbtns button:disabled{opacity:.28}
  .ordbtns svg{width:14px;height:14px}
  /* --- Onboarding --- */
  #onbBg{position:fixed;inset:0;background:var(--bg);background-image:var(--bg-grad);z-index:200;display:none;flex-direction:column}
  #onbBg.on{display:flex}
  .onb-body{flex:1;overflow:auto;padding:calc(28px + env(safe-area-inset-top)) 22px 10px;max-width:580px;width:100%;margin:0 auto}
  .onb-foot{padding:12px 22px calc(20px + env(safe-area-inset-bottom));max-width:580px;width:100%;margin:0 auto}
  .onb-ico{width:74px;height:74px;border-radius:22px;background:var(--volt);color:#0b0c0f;display:grid;place-items:center;transform:rotate(-6deg);margin-bottom:20px}
  .onb-ico svg{width:38px;height:38px}
  .onb-t{font-family:Impact,sans-serif;font-size:34px;letter-spacing:1.5px;line-height:1.05;margin:0 0 10px}
  .onb-b{font-size:16px;color:var(--muted);line-height:1.5}
  .onb-b b{color:var(--txt)}
  .onb-dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
  .onb-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
  .onb-dots i.on{background:var(--volt);width:22px;border-radius:5px}
  .onb-skip{text-align:center;margin-top:12px;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}

  /* ===== FORJA V3 ===== */
  .seriesbox{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .serieshead,.seriesrow{display:grid;grid-template-columns:34px 1fr 1fr 70px 44px;gap:6px;align-items:center;padding:7px 8px}
  .serieshead{background:#0e1014;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.45px;font-weight:700}
  .seriesrow{border-top:1px solid var(--line)}
  .seriesrow:first-of-type{border-top:none}
  .seriesrow input,.seriesrow select{padding:9px 6px;text-align:center;font-size:14px;border-radius:9px}
  .seriesrow .snum{font-weight:800;text-align:center;color:var(--muted)}
  .setdone{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-weight:800}
  .setdone.on{background:var(--volt);border-color:var(--volt);color:#0b0c0f}
  .machsetup{margin-top:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .machnote{font-size:11.5px;color:var(--blue)}
  .guidebar{margin:10px 0 12px}
  .guidebar .gcount{text-align:center;font-weight:800;margin:7px 0}
  .guidebar .grid2{align-items:center}
  .autosave{font-size:11.5px;color:var(--green);margin-top:6px}
  @media(max-width:390px){
    .serieshead,.seriesrow{grid-template-columns:28px 1fr 1fr 62px 40px;gap:4px;padding-left:5px;padding-right:5px}
    .seriesrow input,.seriesrow select{font-size:13px;padding:8px 3px}
  }
</style>

.runcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}

<div class="wrap">

        <button class="disccard" onclick="openYoga()">

          <span class="goarr">›</span>

          <span style="flex:1;min-width:0"><span class="ttl" data-i18n="disc_run"></span><span class="sub" data-i18n="disc_run_sub"></span></span>
          <span class="goarr">›</span>

    </div>
    <div id="progRunning" style="display:none"></div>
    <div id="progYoga" style="display:none"></div>
    <div id="progMobility" style="display:none"></div>
  </section>

  <section class="view" id="v-mas">
    <h2 class="sec"><span class="ic" id="icMore"></span><span data-i18n="more_title"></span></h2>

</div>

 lg_sumo:{es:{c:["Pies bien anchos, punteras 30-45° hacia afuera","Rodillas siguiendo la dirección de los pies","Bajá entre las piernas manteniendo el torso vertical"],e:["Rodillas que colapsan hacia adentro","Inclinar el torso como en un peso muerto"]},de:{c:["Sehr breiter Stand, Zehen 30-45° nach außen","Knie folgen der Fußrichtung","Zwischen den Beinen senken, Oberkörper aufrecht"],e:["Knie fallen nach innen","Oberkörper kippt wie beim Kreuzheben"]}},
 lg_frontsquat:{es:{c:["Barra sobre los deltoides frontales, codos bien altos","Bajá con el torso lo más vertical posible","Empujá el piso, subí sin adelantar la cadera"],e:["Codos que caen y hacen rodar la barra","Despegar los talones por falta de movilidad de tobillo"]},de:{c:["Stange auf der vorderen Schulter, Ellbogen hoch","Möglichst aufrecht senken","Boden wegdrücken, Hüfte nicht vorschieben"],e:["Ellbogen sinken, die Stange rollt nach vorn","Fersen heben wegen fehlender Sprunggelenksmobilität"]}},
 lg_squatbw:{es:{c:["Pies al ancho de hombros, punteras levemente afuera","Cadera atrás y abajo, como sentándote en una silla","Rodillas hacia afuera, peso repartido en todo el pie"],e:["Rodillas hacia adentro al subir","Espalda redondeada en la parte baja"]},de:{c:["Schulterbreiter Stand, Zehen leicht nach außen","Hüfte nach hinten und unten, wie auf einen Stuhl","Knie nach außen, Gewicht auf dem ganzen Fuß"],e:["Knie fallen beim Hochkommen nach innen","Runder Rücken in der tiefen Position"]}},
 gl_hipthrust:{es:{c:["Borde del banco justo debajo de los omóplatos","Mentón hacia el pecho, costillas cerradas","Arriba: cadera en línea con rodillas y hombros, apretá 1 segundo"],e:["Hiperextender la lumbar en vez de apretar el glúteo","Apoyar el peso en las puntas de los pies"]},de:{c:["Bankkante direkt unter den Schulterblättern","Kinn zur Brust, Rippen geschlossen","Oben Hüfte in Linie mit Knien und Schultern, 1 Sekunde anspannen"],e:["Ins Hohlkreuz gehen statt den Po anzuspannen","Gewicht auf den Fußballen statt auf den Fersen"]}},
 gl_glutebridge:{es:{c:["Talones cerca de la cola, pies firmes en el piso","Subí empujando con los talones","Pausá arriba y apretá el glúteo antes de bajar"],e:["Empujar con la lumbar en vez del glúteo","Subir con impulso y bajar de golpe"]},de:{c:["Fersen nah am Po, Füße fest am Boden","Über die Fersen nach oben drücken","Oben pausieren und den Po anspannen"],e:["Aus dem unteren Rücken drücken statt aus dem Po","Mit Schwung hoch und ruckartig runter"]}},
 gl_kickback:{es:{c:["Torso firme, sin arquear la lumbar","Llevá la pierna atrás desde la cadera, no desde la espalda","Apretá el glúteo arriba y volvé despacio"],e:["Arquear la espalda para ganar rango","Rotar la cadera hacia afuera"]},de:{c:["Rumpf fest, kein Hohlkreuz","Bein aus der Hüfte nach hinten, nicht aus dem Rücken","Oben den Po anspannen, langsam zurück"],e:["Rücken überstrecken, um weiter zu kommen","Hüfte dreht nach außen"]}},
 gl_abductor:{es:{c:["Inclinate un poco hacia adelante para tomar más glúteo","Abrí controlada y pausá 1 segundo","Volvé despacio sin que las placas toquen"],e:["Usar impulso del torso hacia atrás","Volver de golpe soltando la tensión"]},de:{c:["Leicht vorlehnen, um den Po stärker zu treffen","Kontrolliert öffnen, 1 Sekunde halten","Langsam zurück, Gewichte setzen nicht ab"],e:["Mit Schwung aus dem Oberkörper arbeiten","Ruckartig zurück, Spannung geht verloren"]}},
 gl_adductor:{es:{c:["Espalda apoyada, abdomen activo","Cerrá parejo sin golpear las rodillas","Abrí despacio hasta sentir estiramiento suave"],e:["Abrir demasiado y forzar la ingle","Cerrar con golpe seco"]},de:{c:["Rücken angelehnt, Bauch aktiv","Gleichmäßig schließen, Knie nicht zusammenschlagen","Langsam öffnen bis zur leichten Dehnung"],e:["Zu weit öffnen und die Leiste überdehnen","Ruckartig schließen"]}},
 gl_sldl:{es:{c:["Pierna de apoyo con la rodilla apenas flexionada","Cadera y hombros paralelos al piso, sin abrirse","Bajá hasta media pierna y volvé apretando el glúteo"],e:["Rotar la cadera hacia el costado libre","Redondear la espalda al bajar"]},de:{c:["Standbein mit leicht gebeugtem Knie","Hüfte und Schultern parallel zum Boden","Bis zur Mitte des Schienbeins senken, mit dem Po hochziehen"],e:["Hüfte dreht zur freien Seite","Runder Rücken beim Senken"]}},
 gl_singlethrust:{es:{c:["La otra pierna se mantiene recogida o extendida, quieta","Cadera pareja: no dejes caer un lado","Apretá arriba 1-2 segundos"],e:["Rotar la pelvis hacia el lado sin apoyo","Empujar con la punta del pie en vez del talón"]},de:{c:["Das andere Bein bleibt ruhig angezogen oder gestreckt","Hüfte gerade halten, keine Seite absacken lassen","Oben 1-2 Sekunden anspannen"],e:["Becken dreht zur unbelasteten Seite","Über den Ballen statt über die Ferse drücken"]}},
 gl_cablepullthrough:{es:{c:["De espaldas a la polea, cuerda entre las piernas","Cadera bien atrás, espalda recta (es una bisagra)","Terminá apretando el glúteo, no tirando con los brazos"],e:["Convertirlo en sentadilla en vez de bisagra de cadera","Hiperextender la lumbar al final"]},de:{c:["Rücken zum Kabel, Seil zwischen den Beinen","Hüfte weit zurück, Rücken gerade (Hip Hinge)","Zum Schluss den Po anspannen, nicht mit den Armen ziehen"],e:["Zur Kniebeuge machen statt Hip Hinge","Am Ende ins Hohlkreuz gehen"]}},
 gl_frogpump:{es:{c:["Plantas de los pies juntas, rodillas abiertas","Subí la cadera solo con el glúteo","Reps altas y continuas, sin pausas largas"],e:["Empujar con la lumbar","Juntar las rodillas al subir"]},de:{c:["Fußsohlen zusammen, Knie geöffnet","Hüfte nur aus dem Po heben","Viele Wiederholungen am Stück, kaum Pausen"],e:["Aus dem unteren Rücken drücken","Knie schließen sich beim Hochdrücken"]}},
 bk_latpulldown:{es:{c:["Agarre algo más ancho que los hombros","Iniciá bajando los omóplatos, después tirá con los codos","Barra al pecho alto, pecho hacia arriba"],e:["Tirar solo con los brazos","Echar el torso muy atrás para ayudarse"]},de:{c:["Griff etwas breiter als die Schultern","Zuerst Schulterblätter senken, dann mit den Ellbogen ziehen","Stange zur oberen Brust, Brust nach oben"],e:["Nur mit den Armen ziehen","Oberkörper stark nach hinten lehnen"]}},
 bk_seatedrow:{es:{c:["Pecho alto y espalda neutra, sin balancearte","Tirá al ombligo juntando los omóplatos","Estirá del todo adelante sin redondear"],e:["Balancear el torso adelante y atrás","Encoger los hombros hacia las orejas"]},de:{c:["Brust hoch, Rücken neutral, kein Schwingen","Zum Bauchnabel ziehen, Schulterblätter zusammen","Vorne ganz strecken, ohne zu runden"],e:["Oberkörper vor und zurück schwingen","Schultern zu den Ohren ziehen"]}},
 bk_dbrow:{es:{c:["Espalda paralela al piso, apoyada en el banco","Codo pegado al cuerpo, tirá hacia la cadera","Pausá arriba apretando la escápula"],e:["Rotar el torso para levantar más peso","Tirar con el bíceps en vez de la espalda"]},de:{c:["Rücken parallel zum Boden, auf der Bank gestützt","Ellbogen am Körper, zur Hüfte ziehen","Oben pausieren, Schulterblatt anspannen"],e:["Oberkörper drehen, um mehr Gewicht zu bewegen","Mit dem Bizeps ziehen statt mit dem Rücken"]}},
 bk_barbellrow:{es:{c:["Torso a unos 45°, cadera atrás y espalda neutra","Barra pegada al cuerpo, tirá al ombligo","Bajá controlada sin dejar caer el peso"],e:["Enderezar el torso durante la serie","Redondear la espalda baja"]},de:{c:["Oberkörper ca. 45°, Hüfte zurück, Rücken neutral","Stange nah am Körper, zum Bauchnabel ziehen","Kontrolliert ablassen, nicht fallen lassen"],e:["Oberkörper richtet sich während des Satzes auf","Unterer Rücken rundet sich"]}},
 bk_facepull:{es:{c:["Polea a la altura de la cara","Tirá llevando las manos hacia las orejas","Abrí los codos y rotá hacia afuera al final"],e:["Usar demasiado peso y tirar con el torso","Codos que caen por debajo de los hombros"]},de:{c:["Kabel auf Gesichtshöhe","Hände zu den Ohren ziehen","Ellbogen öffnen, am Ende nach außen rotieren"],e:["Zu viel Gewicht und Ziehen aus dem Rumpf","Ellbogen sinken unter Schulterhöhe"]}},
 bk_assistedpullup:{es:{c:["Manos algo más anchas que los hombros","Bajá los hombros antes de tirar","Subí hasta que el mentón pase la barra"],e:["Rango corto sin estirar abajo","Balancear las piernas para ayudarse"]},de:{c:["Hände etwas breiter als die Schultern","Schultern senken, bevor du ziehst","Bis das Kinn über der Stange ist"],e:["Zu kurzer Radius, unten nicht ausstrecken","Mit den Beinen schwingen"]}},
 bk_superman:{es:{c:["Brazos y piernas estirados, mirada al piso","Subí desde la espalda baja y el glúteo, poco rango","Pausá 1-2 segundos arriba"],e:["Tirar la cabeza hacia atrás","Buscar demasiada altura y forzar la lumbar"]},de:{c:["Arme und Beine gestreckt, Blick zum Boden","Aus unterem Rücken und Po heben, kleiner Radius","Oben 1-2 Sekunden halten"],e:["Kopf in den Nacken legen","Zu hoch heben und den unteren Rücken überlasten"]}},
 bk_hyperext:{es:{c:["Almohadilla justo debajo de la cadera","Bajá con la espalda recta, doblando desde la cadera","Subí hasta la línea del cuerpo, no más"],e:["Hiperextender arriba arqueando la lumbar","Bajar redondeando la espalda"]},de:{c:["Polster direkt unter der Hüfte","Mit geradem Rücken aus der Hüfte senken","Nur bis zur Körperlinie heben"],e:["Oben ins Hohlkreuz überstrecken","Beim Senken den Rücken runden"]}},
 ch_chestpress:{es:{c:["Agarres a la altura media del pecho","Omóplatos juntos y apoyados en el respaldo","Empujá sin bloquear del todo los codos"],e:["Levantar los hombros del respaldo","Bajar demasiado rápido perdiendo la tensión"]},de:{c:["Griffe auf mittlerer Brusthöhe","Schulterblätter zusammen und an der Lehne","Drücken, ohne die Ellbogen ganz zu sperren"],e:["Schultern heben von der Lehne ab","Zu schnelles Ablassen, Spannung geht verloren"]}},
 ch_dbpress:{es:{c:["Mancuernas a la altura del pecho, codos a 45°","Empujá juntando hacia el centro sin chocarlas","Bajá hasta sentir estiramiento, sin forzar el hombro"],e:["Codos abiertos a 90°: castiga el hombro","Arquear mucho la espalda para levantar más"]},de:{c:["Hanteln auf Brusthöhe, Ellbogen 45°","Nach oben und leicht zusammenführen, ohne anzustoßen","Bis zur Dehnung senken, Schulter nicht überlasten"],e:["Ellbogen 90° abgespreizt belastet die Schulter","Starkes Hohlkreuz, um mehr zu heben"]}},
 ch_pecdeck:{es:{c:["Codos a la altura del pecho, levemente flexionados","Juntá al frente y apretá 1 segundo","Abrí despacio hasta sentir estiramiento controlado"],e:["Abrir demasiado atrás y forzar el hombro","Volver de golpe soltando el peso"]},de:{c:["Ellbogen auf Brusthöhe, leicht gebeugt","Vorne zusammenführen und 1 Sekunde halten","Langsam öffnen bis zur kontrollierten Dehnung"],e:["Zu weit nach hinten öffnen, Schulter überlasten","Ruckartig zurück, Gewicht fällt"]}},
 ch_pushup:{es:{c:["Manos algo más anchas que los hombros","Cuerpo en línea recta: glúteo y abdomen activos","Bajá hasta que el pecho quede cerca del piso"],e:["Cadera caída o levantada","Codos abiertos a 90° respecto del torso"]},de:{c:["Hände etwas breiter als die Schultern","Körper in einer Linie, Po und Bauch aktiv","Bis die Brust fast den Boden berührt"],e:["Hüfte hängt durch oder ist zu hoch","Ellbogen 90° abgespreizt"]}},
 sh_machinepress:{es:{c:["Agarres a la altura de los hombros","Empujá arriba sin encoger el cuello","Bajá hasta que el codo quede a 90°"],e:["Subir los hombros hacia las orejas","Arquear la espalda al empujar"]},de:{c:["Griffe auf Schulterhöhe","Nach oben drücken, Nacken locker","Bis 90° Ellbogenwinkel senken"],e:["Schultern zu den Ohren ziehen","Beim Drücken ins Hohlkreuz gehen"]}},
 sh_lateral:{es:{c:["Codos apenas flexionados y fijos","Subí hasta la altura del hombro, no más","Meñique levemente más alto que el pulgar"],e:["Usar impulso del cuerpo","Peso excesivo que obliga a encoger el cuello"]},de:{c:["Ellbogen leicht gebeugt und fixiert","Nur bis Schulterhöhe heben","Kleiner Finger minimal höher als der Daumen"],e:["Mit Körperschwung arbeiten","Zu viel Gewicht, Schultern ziehen hoch"]}},
 sh_reardelt:{es:{c:["Torso inclinado, espalda recta","Abrí los brazos hacia los costados, no hacia atrás","Peso liviano y control total"],e:["Tirar con la espalda alta en vez del deltoide","Levantar el torso durante la serie"]},de:{c:["Oberkörper vorgebeugt, Rücken gerade","Arme zur Seite öffnen, nicht nach hinten","Leichtes Gewicht, volle Kontrolle"],e:["Aus dem oberen Rücken ziehen statt aus der Schulter","Oberkörper richtet sich während des Satzes auf"]}},
 ar_dbcurl:{es:{c:["Codos pegados al costado, quietos","Subí girando la palma hacia arriba","Bajá en 2-3 segundos con control"],e:["Balancear el torso para subir","Mover los codos hacia adelante"]},de:{c:["Ellbogen am Körper, unbeweglich","Beim Heben die Handfläche nach oben drehen","In 2-3 Sekunden kontrolliert senken"],e:["Mit dem Oberkörper schwingen","Ellbogen wandern nach vorn"]}},
 ar_tripushdown:{es:{c:["Codos fijos al costado del cuerpo","Estirá completo abajo y apretá 1 segundo","Subí solo hasta 90°, sin abrir los codos"],e:["Separar los codos del cuerpo","Inclinarse encima de la polea para empujar con el peso corporal"]},de:{c:["Ellbogen fix am Körper","Unten ganz strecken und 1 Sekunde halten","Nur bis 90° zurück, Ellbogen bleiben eng"],e:["Ellbogen lösen sich vom Körper","Sich über das Kabel lehnen und mit Körpergewicht drücken"]}},
 ar_dips:{es:{c:["Manos al borde del banco, dedos al frente","Codos hacia atrás, no hacia los costados","Bajá hasta 90° de codo, no más"],e:["Bajar demasiado y forzar el hombro","Alejar mucho la cadera del banco"]},de:{c:["Hände an der Bankkante, Finger nach vorn","Ellbogen nach hinten, nicht zur Seite","Bis 90° Ellbogenwinkel senken, nicht tiefer"],e:["Zu tief senken und die Schulter überlasten","Hüfte zu weit von der Bank entfernt"]}},
 ab_plank:{es:{c:["Codos justo debajo de los hombros","Glúteo y abdomen apretados, pelvis metida","Respirá normal, no aguantes el aire"],e:["Cadera caída (arquea la lumbar)","Cola muy alta buscando descanso"]},de:{c:["Ellbogen direkt unter den Schultern","Po und Bauch fest, Becken leicht gekippt","Normal weiteratmen, nicht die Luft anhalten"],e:["Hüfte hängt durch (Hohlkreuz)","Po zu hoch, um sich auszuruhen"]}},
 ab_sideplank:{es:{c:["Codo debajo del hombro, pies apilados","Subí la cadera hasta formar una línea recta","Si cuesta, apoyá la rodilla de abajo"],e:["Cadera que se va hacia atrás","Dejar caer la cadera al piso"]},de:{c:["Ellbogen unter der Schulter, Füße übereinander","Hüfte heben bis zur geraden Linie","Wenn es zu schwer ist, unteres Knie ablegen"],e:["Hüfte kippt nach hinten","Hüfte sackt zum Boden ab"]}},
 ab_deadbug:{es:{c:["Lumbar pegada al piso todo el tiempo","Bajá brazo y pierna opuestos, despacio","Exhalá al extender"],e:["Despegar la zona lumbar del piso","Ir demasiado rápido"]},de:{c:["Unterer Rücken durchgehend am Boden","Gegenarm und -bein langsam senken","Beim Strecken ausatmen"],e:["Unterer Rücken hebt vom Boden ab","Zu schnelle Ausführung"]}},
 ab_birddog:{es:{c:["Manos bajo los hombros, rodillas bajo la cadera","Extendé brazo y pierna opuestos hasta la línea del cuerpo","Cadera pareja: imaginá un vaso de agua en la espalda"],e:["Rotar la cadera al levantar la pierna","Subir la pierna más alto que la espalda"]},de:{c:["Hände unter den Schultern, Knie unter der Hüfte","Gegenarm und -bein bis zur Körperlinie strecken","Hüfte gerade, wie mit einem Glas Wasser auf dem Rücken"],e:["Hüfte dreht beim Beinheben","Bein höher als der Rücken"]}},
 ab_hollow:{es:{c:["Lumbar pegada al piso, sin huecos","Hombros y piernas apenas despegados","Cuanto más estirada, más difícil: adaptá el rango"],e:["Arquear la espalda baja","Contener la respiración"]},de:{c:["Unterer Rücken fest am Boden","Schultern und Beine nur leicht angehoben","Je gestreckter, desto schwerer: Radius anpassen"],e:["Unterer Rücken hebt ab","Luft anhalten"]}},
 ab_legraise:{es:{c:["Manos bajo la cola para proteger la lumbar","Bajá las piernas solo hasta donde la espalda siga apoyada","Subí sin impulso"],e:["Dejar caer las piernas de golpe","Despegar la lumbar en la bajada"]},de:{c:["Hände unter den Po zum Schutz des Rückens","Beine nur so weit senken, wie der Rücken am Boden bleibt","Ohne Schwung heben"],e:["Beine ruckartig fallen lassen","Unterer Rücken hebt beim Senken ab"]}},
 ab_crunch:{es:{c:["Manos apoyadas en el pecho o al costado de la cabeza","Despegá solo los omóplatos, no la espalda entera","Exhalá al subir"],e:["Tirar del cuello con las manos","Subir todo el torso como en un sit-up"]},de:{c:["Hände auf der Brust oder seitlich am Kopf","Nur die Schulterblätter heben, nicht den ganzen Rücken","Beim Hochkommen ausatmen"],e:["Mit den Händen am Nacken ziehen","Den ganzen Oberkörper heben wie beim Sit-up"]}}
};
const CAT_CUES={
 legs:{es:{c:["Bajá en 2-3 segundos y subí con intención","Rodillas alineadas con las puntas de los pies","Peso repartido en todo el pie, no solo la punta"],e:["Rango corto: no completar la bajada","Usar impulso en vez de control"]},de:{c:["In 2-3 Sekunden senken, bewusst hochdrücken","Knie in Linie mit den Fußspitzen","Gewicht auf dem ganzen Fuß, nicht nur auf dem Ballen"],e:["Zu kurzer Bewegungsradius","Mit Schwung statt kontrolliert arbeiten"]}},
 glutes:{es:{c:["Pensá en empujar con el talón","Apretá el glúteo 1 segundo en la posición alta","Costillas cerradas: el movimiento sale de la cadera"],e:["Compensar con la zona lumbar","Perder la tensión entre repeticiones"]},de:{c:["Denk daran, über die Ferse zu drücken","Oben 1 Sekunde den Po anspannen","Rippen geschlossen, Bewegung kommt aus der Hüfte"],e:["Mit dem unteren Rücken ausgleichen","Spannung zwischen den Wiederholungen verlieren"]}},
 back:{es:{c:["Iniciá el tirón bajando y juntando los omóplatos","Codos guían el movimiento, los brazos solo acompañan","Estirá completo al volver, sin soltar la postura"],e:["Tirar con los bíceps en vez de la espalda","Encoger los hombros hacia las orejas"]},de:{c:["Zug mit dem Senken und Zusammenziehen der Schulterblätter beginnen","Ellbogen führen die Bewegung, die Arme folgen nur","Zurück ganz strecken, Haltung beibehalten"],e:["Mit dem Bizeps ziehen statt mit dem Rücken","Schultern zu den Ohren ziehen"]}},
 chest:{es:{c:["Omóplatos juntos y estables durante todo el movimiento","Codos a unos 45° del torso, no a 90°","Controlá la bajada 2-3 segundos"],e:["Rebotar el peso en el pecho","Bloquear los codos de golpe arriba"]},de:{c:["Schulterblätter zusammen und stabil","Ellbogen ca. 45° zum Rumpf, nicht 90°","Absenken in 2-3 Sekunden kontrollieren"],e:["Gewicht auf der Brust abfedern","Ellbogen oben ruckartig durchstrecken"]}},
 shoulders:{es:{c:["Peso moderado y control: el hombro es delicado","Hombros abajo, lejos de las orejas","Sin impulso del torso ni de las rodillas"],e:["Usar demasiado peso y compensar con la espalda","Balancear el cuerpo para levantar"]},de:{c:["Moderates Gewicht und Kontrolle, die Schulter ist empfindlich","Schultern unten lassen, weg von den Ohren","Kein Schwung aus Rumpf oder Knien"],e:["Zu viel Gewicht und Ausgleich über den Rücken","Mit dem Körper schwingen"]}},
 arms:{es:{c:["Codos fijos: solo se mueve el antebrazo","Apretá 1 segundo en el punto de máxima contracción","Bajá lento, la fase negativa es la que más suma"],e:["Balancear el torso para completar la repetición","Rango incompleto por exceso de peso"]},de:{c:["Ellbogen fixiert, nur der Unterarm bewegt sich","1 Sekunde im Punkt der stärksten Kontraktion halten","Langsam senken, die negative Phase bringt am meisten"],e:["Mit dem Oberkörper schwingen","Unvollständiger Radius wegen zu viel Gewicht"]}},
 abs:{es:{c:["Lumbar controlada: no la despegues del piso","Exhalá en el esfuerzo","Calidad sobre cantidad: mejor pocas bien hechas"],e:["Tirar del cuello con las manos","Usar impulso en vez del abdomen"]},de:{c:["Unteren Rücken kontrollieren, nicht abheben lassen","Bei der Anstrengung ausatmen","Qualität vor Quantität"],e:["Mit den Händen am Nacken ziehen","Mit Schwung statt mit der Bauchmuskulatur arbeiten"]}},
 warmup:{es:{c:["Movimiento amplio pero sin dolor","Empezá suave y aumentá el rango de a poco","10-12 repeticiones o 30-40 segundos alcanzan"],e:["Forzar el rango en frío","Ir demasiado rápido"]},de:{c:["Große Bewegung, aber ohne Schmerz","Sanft beginnen, den Radius langsam vergrößern","10-12 Wiederholungen oder 30-40 Sekunden reichen"],e:["Den Radius kalt erzwingen","Zu schnell ausführen"]}},
 stretch:{es:{c:["Estirá hasta sentir tensión, nunca dolor","Mantené 20-30 segundos respirando normal","Repetí de los dos lados"],e:["Rebotar durante el estiramiento","Contener la respiración"]},de:{c:["Bis zur Spannung dehnen, nie bis zum Schmerz","20-30 Sekunden halten, normal weiteratmen","Beide Seiten wiederholen"],e:["Während der Dehnung federn","Die Luft anhalten"]}},
 cardio:{es:{c:["Ritmo en el que todavía podés hablar","Postura erguida, hombros relajados","Terminá bajando el ritmo 1-2 minutos"],e:["Arrancar demasiado fuerte","Colgarse de los manubrios"]},de:{c:["Tempo, bei dem du noch sprechen kannst","Aufrechte Haltung, Schultern locker","Zum Schluss 1-2 Minuten auslaufen"],e:["Zu schnell starten","Sich an den Griffen abstützen"]}}
};
function howToOf(id){
 const e=LIB[id]; if(!e)return null;
 const L=(DB.lang==='de')?'de':'es';
 const own=CUES[id]&&(CUES[id][L]||CUES[id].es); if(own)return own;
 const gen=CAT_CUES[e.cat]&&(CAT_CUES[e.cat][L]||CAT_CUES[e.cat].es); if(!gen)return null;
 const first=dinstr(e);

function stripDayNum(s){ return (s||"").replace(/^\s*(D[ií]a|Tag)\s*\d+\s*[·.\-:]\s*/i,"").trim(); }
function load(){ try{const raw=localStorage.getItem(KEY); if(raw){const d=JSON.parse(raw); if(!d.lang)d.lang="es"; if(!d.photos)d.photos=[]; if(d.name==null)d.name=""; if(!d.measures)d.measures=[]; if(!d.cycle)d.cycle=[]; if(!d.settings)d.settings={weeklyGoal:3,cycleLen:28}; if(!d.machineSettings)d.machineSettings={}; if(!d.programStartDate)d.programStartDate=today(); if(d.gems==null)d.gems=0; if(!d.frozenWeeks)d.frozenWeeks=[]; if(d.prCount==null)d.prCount=0; if(!d.medalsSeen)d.medalsSeen=[];
  if(!d.routineMig){ (d.routine||[]).forEach(day=>{ day.name=stripDayNum(day.name); day.nameDe=stripDayNum(day.nameDe); }); if(d.routine&&d.routine.length>=3){ const tmp=d.routine[1]; d.routine[1]=d.routine[2]; d.routine[2]=tmp; } d.routineMig=true; }
  /* v3.2: migra SOLO la rutina original vieja de 4 días a la nueva base de 3 días.
     No toca rutinas personalizadas ni borra historial, diario, fotos o progreso. */
  if(!d.gym3Mig){
    const legacy=new Set(["Piernas y glúteos","Brazos, hombros y full","Espalda y pecho","Full body express (opcional)"]);
    const names=(d.routine||[]).map(x=>stripDayNum(x.name));
    if(names.length===4 && names.every(n=>legacy.has(n))){
      d.routine=defaultRoutine(); d.activeDay=0; d.session=null;
    }
    d.gym3Mig=true;
  }
  /* v3.3: rutina V2 personalizada.
     Migra solo las rutinas base anteriores; no pisa una rutina editada por la usuaria. */
  if(!d.gymV2Mig){
    const baseV1=new Set(["Base fuerte · glúteos","Espalda fuerte · piernas","Full body · energía"]);
    const baseOld=new Set(["Piernas y glúteos","Brazos, hombros y full","Espalda y pecho","Full body express (opcional)"]);
    const names=(d.routine||[]).map(x=>stripDayNum(x.name));
    const isV1=names.length===3 && names.every(n=>baseV1.has(n));
    const isOld=names.length===4 && names.every(n=>baseOld.has(n));
    if(isV1||isOld){ d.routine=defaultRoutine(); d.activeDay=0; d.session=null; }
    d.gymV2Mig=true;
  }
  /* v3.1: onboarding y sesión en curso. Quien ya tenía datos guardados NO ve el onboarding. */
  if(d.onboarded==null)d.onboarded=true;
  if(d.session===undefined)d.session=null; if(d.session&&!d.session.draft)d.session.draft={};
  /* Blindaje: un backup sin rutina (o vacía) rompía la vista Entrenar. */
  if(!Array.isArray(d.routine)||!d.routine.length)d.routine=defaultRoutine();
  if(!(d.activeDay>=0&&d.activeDay<d.routine.length))d.activeDay=0;
  if(!Array.isArray(d.yogaLogs))d.yogaLogs=[];
  ensureRunningDB(d); ensureYogaDB(d);
  return d;}}catch(e){} return seed(); }

function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString(DB.lang==='de'?'de-DE':'es-AR',{weekday:"short",day:"numeric",month:"short"}); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function startOfWeek(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function dn(o){ return (DB.lang==='de'&&o.nameDe)?o.nameDe:o.name; }

function timeWord(n){ return n===1?t('time_once'):t('time_many'); }
function metaFor(it){
 if(it.scheme) return esc(it.scheme);
 if(it.kind==='cardio') return `${it.rMin}-${it.rMax} min`;
 if(it.kind==='hold') return `${it.sets} × ${it.rMin}-${it.rMax} ${t('secs')} · ${it.rest}${t('secs')} ${t('rest')}`;
 if(it.kind==='move') return it.rMin? `${it.rMin}-${it.rMax} ${t('secs')}` : t('cat_warmup');
 if(it.kind==='reps') return `${it.sets} × ${it.rMin}-${it.rMax} ${t('reps')} · ${it.rest}${t('secs')} ${t('rest')}`;
 return `${it.sets} × ${it.rMin}-${it.rMax} ${t('reps')} · ${it.rest}${t('secs')} ${t('rest')}`; // weight
}

/* ===== FASE / PROGRESIÓN ===== */
function weeksSinceStart(){ return Math.floor(daysBetween(DB.startDate,today())/7); }
function phaseInfo(){ const w=weeksSinceStart(); if(w<3)return{n:1,text:t('phase1')}; if(w<8)return{n:2,text:t('phase2')}; return{n:3,text:t('phase3')}; }
/* Últimas N sesiones con peso de un ejercicio (derivado de DB.logs: siempre
   en sincronía, sobrevive a importar backups y no duplica datos). */
function lastSessions(name,n){
 const max=n||3, out=[];
 for(let i=DB.logs.length-1;i>=0&&out.length<max;i--){
  const f=(DB.logs[i].exercises||[]).find(x=>x.name===name&&x.kind==='weight'&&x.weight>0);
  if(f)out.push({date:DB.logs[i].date,weight:f.weight,reps:f.reps||0,rir:(f.rir==null?null:+f.rir),top:!!f.top});
 }
 return out;
}
function lastForExercise(name){ const h=lastSessions(name,1); return h.length?h[0]:null; }
function stepFor(w){ return w>=60?5:w>=30?2.5:w>=10?2:1; }
function roundStep(w){ return Math.round(w*2)/2; }
/* Progresión: si hay RIR usamos RIR + reps; si no, la regla vieja (top + reps al máximo). */
function suggestion(it){
 const hist=lastSessions(it.name,3);
 if(!hist.length)return{type:"new",txt:t('sug_new'),pref:"",hist:[]};
 const l=hist[0], step=stepFor(l.weight), hitTop=l.reps>=it.rMax;
 if(l.rir!=null){
  if(l.rir>=3&&hitTop){ const w=roundStep(l.weight+step*2); return{type:"up",txt:t('sug_up_rir',{w,rir:l.rir,r:l.reps,ow:l.weight}),pref:w,hist}; }
  if(l.rir>=2&&hitTop){ const w=roundStep(l.weight+step); return{type:"up",txt:t('sug_up_rir',{w,rir:l.rir,r:l.reps,ow:l.weight}),pref:w,hist}; }
  if(l.rir<=0&&l.reps<it.rMin){ const w=roundStep(Math.max(step,l.weight-step)); return{type:"down",txt:t('sug_down',{w,r:l.reps}),pref:w,hist}; }
  return{type:"hold",txt:t('sug_hold_rir',{w:l.weight,r:l.reps,rir:l.rir}),pref:l.weight,hist};
 }
 if(l.top&&hitTop){ const w=roundStep(l.weight+step); return{type:"up",txt:t('sug_up_reps',{w,r:l.reps,ow:l.weight}),pref:w,hist}; }
 return{type:"hold",txt:t('sug_hold',{w:l.weight,r:l.reps}),pref:l.weight,hist};
}
function histLine(hist){
 if(!hist||!hist.length)return"";
 const parts=hist.map(h=>`<b>${h.weight}</b>×${h.reps}${h.rir!=null?` <span style="opacity:.7">(${t('rir_short')} ${h.rir})</span>`:''}`);
 return `<div class="lastline">${t('last_sessions')}: ${parts.join(" · ")}</div>`;
}

/* Reordena dentro de la MISMA sección: busca el vecino más cercano con igual
   section y hace swap, así los bloques (calentamiento, abs, etc.) no se mezclan. */
function moveItem(uid,dir){
 const day=DB.routine[DB.activeDay]; if(!day)return;
 const list=day.ex||[], i=list.findIndex(x=>x.uid===uid); if(i<0)return;
 const sec=list[i].section;
 let j=i+dir;
 while(j>=0&&j<list.length&&list[j].section!==sec)j+=dir;
 if(j<0||j>=list.length)return;
 const tmp=list[i]; list[i]=list[j]; list[j]=tmp;
 save(); renderRutina();
}

/* ===== TIMERS NATIVOS (holds y cardio) ===== */
const inlineTimers={};
function fmtClock(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function clearInlineTimers(){ Object.keys(inlineTimers).forEach(k=>{ clearInterval(inlineTimers[k].int); delete inlineTimers[k]; }); }
function timerId(card){ if(!card.dataset.tid)card.dataset.tid='tm'+uid(); return card.dataset.tid; }
function holdTimer(btn,secs){
 const card=btn.closest('.card'), id=timerId(card), tv=card.querySelector('.tv');
 if(inlineTimers[id]){ clearInterval(inlineTimers[id].int); delete inlineTimers[id]; tv.classList.remove('run'); tv.textContent=fmtClock(secs); btn.textContent=t('timer_start'); btn.classList.add('go'); return; }
 let left=secs; tv.textContent=fmtClock(left); tv.classList.add('run'); btn.textContent=t('timer_stop'); btn.classList.remove('go');
 inlineTimers[id]={int:setInterval(()=>{
  left--;
  if(left<=0){ clearInterval(inlineTimers[id].int); delete inlineTimers[id]; tv.textContent=t('timer_done'); tv.classList.remove('run'); btn.textContent=t('timer_start'); btn.classList.add('go');
   const inp=card.querySelector('.t-secs'); if(inp&&!inp.value)inp.value=secs; buzz(); }
  else tv.textContent=fmtClock(left);
 },1000)};
}
function cardioTimer(btn){
 const card=btn.closest('.card'), id=timerId(card), tv=card.querySelector('.tv');
 if(inlineTimers[id]){ const o=inlineTimers[id]; clearInterval(o.int); delete inlineTimers[id]; tv.classList.remove('run'); btn.textContent=t('timer_start'); btn.classList.add('go');
  const inp=card.querySelector('.t-min'); if(inp)inp.value=Math.max(1,Math.round(o.sec/60)); return; }
 const o={sec:0}; tv.textContent='0:00'; tv.classList.add('run'); btn.textContent=t('timer_stop'); btn.classList.remove('go');
 o.int=setInterval(()=>{ o.sec++; tv.textContent=fmtClock(o.sec); },1000);
 inlineTimers[id]=o;
}

let pendingWorkout=null, modalRpe=null;
function saveWorkout(){
 const idx=+document.getElementById("trainDaySel").value; const exercises=[];
 document.querySelectorAll("#trainBody .card").forEach(c=>{
  const name=c.dataset.ex, kind=c.dataset.kind, cat=c.dataset.cat||'';
  const setsDone=c.querySelectorAll('.setdot.on').length, setsTotal=+c.dataset.sets||0;
  if(kind==='weight'){
   const w=+c.querySelector(".t-weight").value||0, r=+c.querySelector(".t-reps").value||0;
   const de=c.querySelector(".t-detail"), detail=de?de.value.trim():'';
   const rirRaw=c.dataset.rir, rir=(rirRaw===''||rirRaw==null)?null:+rirRaw;
   const top=setsTotal>0&&setsDone>=setsTotal;
   if(w>0||r>0||detail||setsDone){ const o={name,kind,cat,weight:w,reps:r,top,sets:setsTotal,setsDone,detail}; if(rir!=null)o.rir=rir; exercises.push(o); }
  }
  else if(kind==='reps'){ const r=+c.querySelector(".t-reps").value||0; if(r>0||setsDone)exercises.push({name,kind,cat,reps:r,done:setsDone>0,setsDone,sets:setsTotal,weight:0}); }
  else if(kind==='hold'){ const sc=+c.querySelector(".t-secs").value||0; if(sc>0||setsDone)exercises.push({name,kind,cat,secs:sc,done:setsDone>0,setsDone,sets:setsTotal,weight:0}); }
  else if(kind==='cardio'){ const mn=c.querySelector(".t-min").value.trim(); if(mn)exercises.push({name,kind,cat,note:mn,weight:0}); }
  else { const done=c.querySelector(".t-done").checked; if(done)exercises.push({name,kind,cat,done,weight:0}); }
 });
 if(!exercises.length){ alert(t('pick_one')); return; }
 pendingWorkout={idx,exercises}; modalRpe=null;
 openRpeModal();
}
function setRpe(el,v){ modalRpe=v; el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }
function openRpeModal(){
 const mins=sessionMinutes();
 let seg=""; for(let v=1;v<=10;v++)seg+=`<button type="button" onclick="setRpe(this,${v})">${v}</button>`;
 showModal(`<h3>${t('rpe_title')}</h3>
  <label class="fld">${t('dur_label')}</label><input type="number" inputmode="numeric" id="wkDur" value="${mins}" min="1" max="300">
  <label class="fld" style="margin-top:12px">${t('rpe_label')}</label>
  <div class="seg tiny">${seg}</div>
  <div class="xs muted" style="margin-top:6px">${t('rpe_help')}</div>
  <button class="btn" style="margin-top:16px" onclick="commitWorkout()"><span class="ic">${ICONS.check}</span>${t('finish_save')}</button>
  <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">${t('cancel')}</button>`);
}
function commitWorkout(){
 if(!pendingWorkout)return;
 const {idx,exercises}=pendingWorkout, day=DB.routine[idx];
 const durEl=document.getElementById('wkDur');
 const durMin=Math.max(1,Math.min(300,+(durEl?durEl.value:0)||sessionMinutes()));
 const prs=[]; exercises.forEach(x=>{ if(x.kind==='weight'&&x.weight>0){ const prev=bestWeight(x.name,DB.logs); if(prev>0&&x.weight>prev) prs.push({name:x.name,w:x.weight}); } });
 const wk=weekStart(today()), goal=(DB.settings&&DB.settings.weeklyGoal)||3, weekBefore=DB.logs.filter(l=>weekStart(l.date)===wk).length;
 const entry={date:today(),dayName:day.name,dayId:day.id,exercises,durMin};
 if(modalRpe!=null)entry.rpe=modalRpe;
 DB.logs.push(entry);
 DB.journal.push({date:today(),tags:["trained"],text:dn(day)});
 DB.session=null; pendingWorkout=null; clearInlineTimers();
 let earned=GEM_PER; const weekJustDone=(weekBefore<goal && weekBefore+1>=goal); if(weekJustDone)earned+=WEEK_BONUS; if(prs.length)earned+=PR_BONUS*prs.length;
 DB.gems=(DB.gems||0)+earned; DB.prCount=(DB.prCount||0)+prs.length;
 save();
 const fresh=checkNewMedals(); save();
 const prHtml=prs.length?`<div class="card" style="border-color:var(--volt);margin-top:8px"><div class="display" style="color:var(--volt);font-size:20px;display:flex;align-items:center;gap:8px">${ICONS.trophy} ${t('pr_title')}</div>${prs.map(p=>`<div class="small" style="margin-top:4px">${esc(t('pr_line',{ex:dn(LIB[lookupId(p.name)]||{name:p.name}),w:p.w}))}</div>`).join("")}</div>`:"";
 const gemHtml=`<div class="card" style="margin-top:8px"><div class="row between"><span class="small">${weekJustDone?t('week_bonus',{n:earned}):t('gems_plus',{n:earned})}</span><span class="display" style="color:var(--blue);font-size:22px;display:flex;align-items:center;gap:6px"><span class="ic" style="width:18px">${ICONS.gem}</span>${DB.gems}</span></div></div>`;
 const medalHtml=fresh.length?`<div class="card" style="border-color:var(--volt);margin-top:8px"><div class="display" style="color:var(--volt);font-size:18px;display:flex;align-items:center;gap:8px"><span class="ic">${ICONS.medal}</span>${t('medal_earned')}</div>${fresh.map(id=>{const m=MEDALS.find(x=>x.id===id);return `<div class="small" style="margin-top:4px">${esc(DB.lang==='de'?m.n.de:m.n.es)}</div>`;}).join("")}</div>`:"";
 showModal(`<h3>${t('saved_title')}</h3><p class="small muted">${t('saved_msg')}</p>${gemHtml}${prHtml}${medalHtml}<button class="btn" style="margin-top:10px" onclick="closeModal();go('inicio')">${t('done')}</button>`);
}
function bestWeight(name,logs){ let b=0; logs.forEach(l=>l.exercises.forEach(x=>{ if(x.name===name&&x.kind==='weight'&&x.weight>b)b=x.weight; })); return b; }
function lookupId(name){ const e=EXERCISES.find(x=>x.name===name); return e?e.id:null; }

function renderProgreso(){
 renderProgTabs();
 const pane=progPane||"strength";
 const map={strength:"progStrength",running:"progRunning",yoga:"progYoga",mobility:"progMobility"};
 Object.keys(map).forEach(k=>{ const el=document.getElementById(map[k]); if(el) el.style.display=pane===k?"block":"none"; });

/* ===== SEQ TIMER — motor genérico de secuencias (Fase 3) =====
   Gym rest (startRest/addRest/stopRest) y Yoga V31 siguen con su timer actual.
   No se cablearon acá a propósito: cambiarlos ahora rompe UI/estabilidad.
   Running futuro: seqStart([{id,label,sec,kind},...], {onStep,onTick,onDone,onCancel}).
   Recalcula con Date.now()/seqNow() (targetEnd), no con remaining--.
   snapshot() es el shape persistible; todavía no se guarda en DB.session. */
let _seqClock=null;
function seqNow(){ return _seqClock==null?Date.now():_seqClock; }
function seqSetClock(ms){ _seqClock=ms; }
function seqClearClock(){ _seqClock=null; }
const seqTimer={
 active:false,paused:false,stepIndex:0,steps:[],
 remainingMs:0,elapsedMs:0,startedAt:0,targetEnd:0,pausedAt:0,
 _int:null,_cbs:{},_done:false,_elapsedBefore:0
};
function seqClearInt(){ if(seqTimer._int){clearInterval(seqTimer._int);seqTimer._int=null;} }
function seqReset(){
 seqClearInt();
 seqTimer.active=false;seqTimer.paused=false;seqTimer.stepIndex=0;seqTimer.steps=[];
 seqTimer.remainingMs=0;seqTimer.elapsedMs=0;seqTimer.startedAt=0;seqTimer.targetEnd=0;seqTimer.pausedAt=0;
 seqTimer._cbs={};seqTimer._done=false;seqTimer._elapsedBefore=0;
}
function seqCurrent(){ return seqTimer.steps[seqTimer.stepIndex]||null; }
function seqNext(){ return seqTimer.steps[seqTimer.stepIndex+1]||null; }
function seqRemainingSec(){ return Math.max(0,Math.ceil(seqTimer.remainingMs/1000)); }
function seqElapsedSec(){ return Math.max(0,Math.round(seqTimer.elapsedMs/1000)); }
function seqSnapshot(){
 return {active:seqTimer.active,paused:seqTimer.paused,stepIndex:seqTimer.stepIndex,remainingMs:seqTimer.remainingMs,elapsedMs:seqTimer.elapsedMs,startedAt:seqTimer.startedAt,targetEnd:seqTimer.targetEnd,steps:seqTimer.steps.slice()};
}
function seqArm(idx,overrunMs){
 while(idx<seqTimer.steps.length){
  const st=seqTimer.steps[idx], dur=Math.max(0,(+st.sec||0)*1000), left=dur-Math.max(0,overrunMs||0);
  if(left>0){
   seqTimer.stepIndex=idx; seqTimer.paused=false;
   seqTimer.startedAt=seqNow(); seqTimer.targetEnd=seqTimer.startedAt+left; seqTimer.remainingMs=left;
   if(seqTimer._cbs.onStep) seqTimer._cbs.onStep(st,idx,seqNext());
   return true;
  }
  seqTimer._elapsedBefore+=dur; overrunMs=-(left); idx++;
 }
 seqTimer.stepIndex=Math.max(0,seqTimer.steps.length-1); seqTimer.remainingMs=0; seqTimer.elapsedMs=seqTimer._elapsedBefore; seqFinish(); return false;
}
function seqFinish(){
 if(seqTimer._done)return;
 seqTimer._done=true; seqTimer.active=false; seqTimer.paused=false; seqClearInt();
 if(seqTimer._cbs.onDone) seqTimer._cbs.onDone(seqSnapshot());
}
function seqSync(){
 if(!seqTimer.active||seqTimer.paused||seqTimer._done) return;
 const now=seqNow(), left=seqTimer.targetEnd-now, st=seqCurrent(), dur=st?((+st.sec||0)*1000):0;
 seqTimer.elapsedMs=seqTimer._elapsedBefore+Math.min(dur,Math.max(0,dur-Math.max(0,left)));
 if(left>0){ seqTimer.remainingMs=left; if(seqTimer._cbs.onTick) seqTimer._cbs.onTick(seqTimer); return; }
 seqTimer._elapsedBefore+=dur;
 if(seqTimer.stepIndex>=seqTimer.steps.length-1){ seqTimer.remainingMs=0; seqTimer.elapsedMs=seqTimer._elapsedBefore; seqFinish(); return; }
 seqArm(seqTimer.stepIndex+1,-left);
}
function seqPulse(){
 seqClearInt();
 if(_seqClock!=null)return;
 seqTimer._int=setInterval(seqSync,250);
}
function seqStart(steps,cbs){
 seqReset();
 seqTimer.steps=(steps||[]).map((s,i)=>({id:s.id||('s'+i),label:s.label||'',sec:+s.sec||0,kind:s.kind||''}));
 seqTimer._cbs=cbs||{};
 if(!seqTimer.steps.length)return false;
 seqTimer.active=true;
 if(!seqArm(0,0))return true;
 seqPulse(); seqSync(); return true;
}
function seqPause(){
 if(!seqTimer.active||seqTimer.paused||seqTimer._done)return;
 seqSync();
 if(!seqTimer.active||seqTimer._done)return;
 seqTimer.paused=true; seqTimer.pausedAt=seqNow();
 seqTimer.remainingMs=Math.max(0,seqTimer.targetEnd-seqTimer.pausedAt);
 seqClearInt();
}
function seqResume(){
 if(!seqTimer.active||!seqTimer.paused||seqTimer._done)return;
 seqTimer.paused=false; seqTimer.startedAt=seqNow(); seqTimer.targetEnd=seqTimer.startedAt+seqTimer.remainingMs;
 seqPulse(); seqSync();
}
function seqSkip(){
 if(!seqTimer.active||seqTimer._done)return;
 const st=seqCurrent(), dur=st?((+st.sec||0)*1000):0;
 seqTimer._elapsedBefore+=dur;
 if(seqTimer.stepIndex>=seqTimer.steps.length-1){ seqTimer.remainingMs=0; seqTimer.elapsedMs=seqTimer._elapsedBefore; seqFinish(); return; }
 seqArm(seqTimer.stepIndex+1,0);
 if(!seqTimer.paused) seqPulse();
 seqSync();
}
function seqCancel(){
 if(!seqTimer.active&&!seqTimer.paused){ seqReset(); return; }
 const cb=seqTimer._cbs.onCancel; seqReset(); if(cb)cb();
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') seqSync(); });
document.addEventListener('pageshow',function(){ seqSync(); });

/* ===== CRONÓMETRO DE DESCANSO ===== */
let restInt=null,restLeft=0,audioCtx=null;
/* iOS no soporta navigator.vibrate: usamos un beep con WebAudio (offline, sin
   archivos). El contexto se desbloquea con el primer toque de la usuaria. */
function unlockAudio(){ if(audioCtx)return; try{ const C=window.AudioContext||window.webkitAudioContext; if(!C)return; audioCtx=new C(); if(audioCtx.state==='suspended')audioCtx.resume(); }catch(e){} }
document.addEventListener('touchstart',unlockAudio,{once:true,passive:true});
document.addEventListener('click',unlockAudio,{once:true});
function beep(){
 try{
  if(!audioCtx)unlockAudio(); if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  [0,0.28].forEach(off=>{
   const o=audioCtx.createOscillator(), g=audioCtx.createGain();
   o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
   g.gain.setValueAtTime(0.0001,now+off);
   g.gain.exponentialRampToValueAtTime(0.22,now+off+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,now+off+0.22);
   o.start(now+off); o.stop(now+off+0.24);
  });
 }catch(e){}
}
function buzz(){ if(navigator.vibrate){try{navigator.vibrate([200,90,200]);}catch(e){}} beep(); }
function startRest(sec){ restLeft=Math.max(1,sec||60); unlockAudio(); document.getElementById('restBar').style.display='flex'; updateRest(); if(restInt)clearInterval(restInt); restInt=setInterval(()=>{ restLeft--; if(restLeft<=0){ stopRest(); buzz(); } else updateRest(); },1000); }
function updateRest(){ const m=Math.floor(restLeft/60),s=restLeft%60; document.getElementById('restTime').textContent=m>0?(m+':'+String(s).padStart(2,'0')):(s+'s'); }
function addRest(n){ restLeft=Math.max(1,restLeft+n); document.getElementById('restBar').style.display='flex'; updateRest(); if(!restInt)startRest(restLeft); }
function stopRest(){ if(restInt)clearInterval(restInt); restInt=null; document.getElementById('restBar').style.display='none'; }

function drawLine(id,pts,unit){ const svg=document.getElementById(id); if(!svg)return; if(!pts||pts.length<2){ svg.innerHTML=`<text x="160" y="75" fill="#5a6473" font-size="12" text-anchor="middle" font-family="system-ui">${t('need2')}</text>`; return; }
 const W=320,H=150,pad=16; const xs=pts.map(p=>+new Date(p.date)),ys=pts.map(p=>p.val); const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys); const rx=(maxX-minX)||1,ry=(maxY-minY)||1; const px=v=>pad+(v-minX)/rx*(W-2*pad), py=v=>H-pad-(v-minY)/ry*(H-2*pad);
 let d="",c=""; pts.forEach((p,i)=>{const x=px(+new Date(p.date)),y=py(p.val); d+=(i?" L":"M")+x.toFixed(1)+" "+y.toFixed(1); c+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#3da5ff"/>`;});
 svg.innerHTML=`<path d="${d}" fill="none" stroke="#3da5ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${c}<text x="${pad}" y="13" fill="#5a6473" font-size="11" font-family="system-ui">${maxY} ${unit||''}</text><text x="${pad}" y="${H-4}" fill="#5a6473" font-size="11" font-family="system-ui">${minY} ${unit||''}</text>`;
}
function ringSvg(done,goal){ const r=26,c=2*Math.PI*r,pct=Math.min(1,goal?done/goal:0),off=c*(1-pct); return `<svg width="74" height="74" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="#0e1014" stroke-width="8"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="#caff00" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 36 36)"/><text x="36" y="35" text-anchor="middle" font-family="Impact" font-size="22" fill="#f3f5f8">${done}</text><text x="36" y="50" text-anchor="middle" font-family="system-ui" font-size="11" fill="#878f9e">/ ${goal}</text></svg>`; }

 const goal=(DB.settings&&DB.settings.weeklyGoal)||3, done=wl.length;
 let vol=0; wl.forEach(l=>l.exercises.forEach(x=>{ if(x.kind==='weight')vol+=(x.weight||0)*(x.reps||0); }));
 let trend="—",tcol="var(--muted)";
 if(DB.weights.length>=2){ const last=DB.weights[DB.weights.length-1]; let ref=DB.weights[0]; for(const w of DB.weights){ if(daysBetween(w.date,today())>=7)ref=w; } const d=last.kg-ref.kg; trend=(d>0?"+":"")+d.toFixed(1)+" kg"; tcol=d<0?"var(--volt)":d>0?"var(--amber)":"var(--muted)"; }
 const en=DB.journal.filter(j=>j.energy&&new Date(j.date+"T00:00:00")>=sow).map(j=>j.energy); const avgEn=en.length?(en.reduce((a,b)=>a+b,0)/en.length).toFixed(1):"—";
 const msg=done>=goal?t('great_week'):t('keep_week',{n:goal-done});
 let cyc=""; if(DB.cycle&&DB.cycle.length){ const info=cycleInfo(); if(info)cyc=`<div class="small muted" style="margin-top:10px;display:flex;align-items:center;gap:6px">${ICONS.drop} ${t('cycle_day',{n:info.day})} · ${t(info.phaseKey)}</div>`; }
 const rp=wl.filter(l=>l.rpe).map(l=>l.rpe); const avgRpe=rp.length?(rp.reduce((a,b)=>a+b,0)/rp.length).toFixed(1):"—";
 const mins=wl.reduce((a,l)=>a+(l.durMin||0),0);
 const totMin=mins?(mins>=60?Math.floor(mins/60)+"h "+(mins%60)+"":mins+" "+t('min_short')):"—";
 document.getElementById('weekSummary').innerHTML=`<div class="card"><div class="ring-wrap">${ringSvg(done,goal)}<div style="flex:1"><div class="display" style="font-size:20px">${t('week_done',{a:done,b:goal})}</div><div class="small" style="color:${done>=goal?'var(--volt)':'var(--muted)'}">${msg}</div></div></div>
  <div class="grid3" style="margin-top:12px"><div style="text-align:center"><div class="muted xs">${t('volume')}</div><div style="font-weight:700">${Math.round(vol)} kg</div></div><div style="text-align:center"><div class="muted xs">${t('weight_trend')}</div><div style="font-weight:700;color:${tcol}">${trend}</div></div><div style="text-align:center"><div class="muted xs">${t('avg_energy')}</div><div style="font-weight:700">${avgEn}</div></div></div>
  <div class="grid3" style="margin-top:12px"><div style="text-align:center"><div class="muted xs">${t('avg_rpe')}</div><div style="font-weight:700">${avgRpe}</div></div><div style="text-align:center"><div class="muted xs">${t('total_min')}</div><div style="font-weight:700">${totMin}</div></div><div style="text-align:center"><div class="muted xs">${t('st_total')}</div><div style="font-weight:700">${DB.logs.length}</div></div></div>${cyc}</div>`
  +volumeBySection(wl);
}
/* Volumen semanal por sección: usa el cat guardado en el log y, para entrenos
   viejos que no lo tienen, lo deduce del catálogo por nombre. */
function catOfLogged(x){ if(x.cat)return x.cat; const id=lookupId(x.name); return id?LIB[id].cat:null; }
const VOL_CATS=["legs","glutes","back","chest","shoulders","arms","abs"];
function volumeBySection(wl){
 const v={}; let total=0;
 wl.forEach(l=>(l.exercises||[]).forEach(x=>{
  if(x.kind!=='weight'||!(x.weight>0))return;
  const c=catOfLogged(x); if(!c||VOL_CATS.indexOf(c)<0)return;
  const s=(x.weight||0)*(x.reps||0)*Math.max(1,x.setsDone||x.sets||1);
  v[c]=(v[c]||0)+s; total+=s;
 }));

function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function cycleAvg(){ const s=[...(DB.cycle||[])].sort(); if(s.length>=2){ let sum=0,c=0; for(let i=1;i<s.length;i++){ const d=daysBetween(s[i-1],s[i]); if(d>=18&&d<=40){sum+=d;c++;} } if(c)return Math.round(sum/c); } return (DB.settings&&DB.settings.cycleLen)||28; }
function cycleInfo(){ if(!DB.cycle||!DB.cycle.length)return null; const s=[...DB.cycle].sort(); let last=s[0]; for(const x of s){ if(x<=today())last=x; } const avg=cycleAvg(); const day=daysBetween(last,today())+1; let next=last; while(next<=today())next=addDays(next,avg); const nextDays=daysBetween(today(),next); const ov=Math.max(10,avg-14); let phaseKey,tip; if(day<=5){phaseKey='phase_menstrual';tip='tip_menstrual';}else if(day<ov){phaseKey='phase_follicular';tip='tip_follicular';}else if(day<=ov+2){phaseKey='phase_ovulation';tip='tip_ovulation';}else{phaseKey='phase_luteal';tip='tip_luteal';} return {day,avg,last,next,nextDays,phaseKey,tip}; }
function markPeriod(){ const d=today(); if(!DB.cycle.includes(d))DB.cycle.push(d); DB.cycle.sort(); save(); renderProgreso(); }

 const predDays=new Set(); let p=info.last; for(let i=0;i<4;i++){ p=addDays(p,info.avg); for(let k=0;k<5;k++)predDays.add(addDays(p,k)); }
 const cal=calMonth(now.getFullYear(),now.getMonth(),iso=>{ let c=""; if(periodDays.has(iso))c+=" period"; else if(predDays.has(iso))c+=" pred"; if(iso===today())c+=" today"; return c; });

const GEM_PER=10, WEEK_BONUS=25, PR_BONUS=15, FREEZE_COST=50;
function weekStart(d){ const x=new Date((d||today())+'T00:00:00'); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.toISOString().slice(0,10); }
function prevWeek(ws){ const d=new Date(ws+'T00:00:00'); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); }
function weekCounts(){ const c={}; strengthLogs().forEach(l=>{ const w=weekStart(l.date); c[w]=(c[w]||0)+1; }); return c; }
function computeStreak(){ const goal=(DB.settings&&DB.settings.weeklyGoal)||3, c=weekCounts(), froz=new Set(DB.frozenWeeks||[]), met=w=>((c[w]||0)>=goal)||froz.has(w), curW=weekStart(today()); let streak=0,cursor;
 if(met(curW)){ streak=1; cursor=prevWeek(curW); } else cursor=prevWeek(curW);
 while(met(cursor)){ streak++; cursor=prevWeek(cursor); }
 return {streak,goal,curW,curCount:c[curW]||0,curMet:met(curW)}; }
function firstLogWeek(){ const logs=strengthLogs(); if(!logs.length)return null; let m=logs[0].date; logs.forEach(l=>{ if(l.date<m)m=l.date; }); return weekStart(m); }
function riskWeek(){ const goal=(DB.settings&&DB.settings.weeklyGoal)||3, c=weekCounts(), froz=new Set(DB.frozenWeeks||[]), met=w=>((c[w]||0)>=goal)||froz.has(w), pw=prevWeek(weekStart(today())), fw=firstLogWeek();
 if(fw && pw>=fw && !met(pw)) return pw; return null; }

 const strip=arr.map(ws=>{ const cnt=c[ws]||0, isCur=ws===s.curW, ok=cnt>=goal, fr=froz.has(ws); const bg=fr?'var(--blue)':(ok?'var(--volt)':'#0e1014'); const col=(fr||ok)?'#0b0c0f':'var(--muted)'; const brd=isCur?'2px solid var(--volt)':'1px solid var(--line)'; return `<div style="flex:1;text-align:center"><div style="height:36px;border-radius:9px;display:grid;place-items:center;background:${bg};color:${col};font-weight:700;border:${brd}">${fr?'❄':cnt}</div></div>`; }).join("");

   <div class="xs muted" style="margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px">${t('weeks_strip')}</div><div style="display:flex;gap:5px">${strip}</div>

}

 if(!e) return "";

}
function strengthLogHasLegs(log){
 const ex=log&&log.exercises||[];

  const cat=strengthExCat(ex[i]);

  const id=ex[i].libId||ex[i].id||"";
  if(id.indexOf("lg_")==0||id.indexOf("gl_")==0) return true;
 }
 return false;
}

  const cat=strengthExCat(ex[i]);
  if(HOY_LEG_CAT[cat]) n++;

}

   reasons.push(strong?"hoy_r_legs_today":"hoy_r_legs_today_easy");
  }else if(d===1){
   score=Math.max(score, (strong&&(rpe||0)>=8)?2:1);
   reasons.push("hoy_r_legs_yday");
  }
 }
 const lastRun=hoyLast(runningLogs());
 if(lastRun){
  const d=hoyDiff(lastRun.date);
  if(d<=1){
   if(lastRun.legs==="pain"){
    conservative=true;
    score=Math.max(score,2);
    reasons.push("hoy_r_run_pain");
   }else if(lastRun.legs==="heavy"){
    score=Math.max(score, d===0?2:1);
    reasons.push("hoy_r_run_heavy");
   }else if((+lastRun.rpe||0)>=7){
    score=Math.max(score,1);
    reasons.push("hoy_r_run_hard");
   }else if((+lastRun.rpe||0)<=3 && lastRun.legs!=="tired"){
    if(d===0) reasons.push("hoy_r_run_easy");
   }else if(lastRun.legs==="tired" || (+lastRun.rpe||0)>=5){
    score=Math.max(score,1);
    reasons.push("hoy_r_run_recent");
   }
  }
 }
 const jtags=new Set();
 (DB.journal||[]).forEach(j=>{
  if(hoyDiff(j.date)<=1) (j.tags||[]).forEach(tg=>jtags.add(tg));
 });
 if(jtags.has("overtrained")||jtags.has("unwell")){
  conservative=true;
  score=Math.max(score,1);
  reasons.push("hoy_r_journal_low");
 }else if(jtags.has("tired")||jtags.has("bad_sleep")||jtags.has("not_strong")||jtags.has("lowered")){
  if(score<2) score=Math.max(score,1);
  reasons.push("hoy_r_journal_tired");
 }
 if(!reasons.length) reasons.push("hoy_r_none");
 const level=score>=2?"high":score>=1?"medium":"low";
 return {level,score,conservative,reasons,lastLegs,lastRun};
}

 if(L.level==="high"&&stNeed&&st.isLegs){
  if(yg&&!yg.done){

 }
 const order=[];
 if(last==="running") order.push("strength","yoga","running");
 else if(last==="strength") order.push("running","yoga","strength");
 else if(last==="yoga"||last==="mobility") order.push("running","strength","yoga");
 else order.push("strength","running","yoga");
 if(L.level==="medium"&&L.lastLegs&&hoyDiff(L.lastLegs.date)===0){
  const i=order.indexOf("running"); if(i>=0) order.splice(i,1);

 }
 for(let i=0;i<order.length;i++){

   return {load:L,kind:"running",title:t("hoy_type_run"),sub:t("hoy_sub_run",{w:run.week,n:run.session&&run.session.id==="s2"?2:run.session&&run.session.id==="s3"?3:1}),recKey:"hoy_rec_run",ctaKey:"hoy_cta_start",alts:hoyAlts(L,run,yg,stNeed,["running"])};

   return {load:L,kind:"yoga",title:t("hoy_type_yg"),sub:t("hoy_sub_yg",{w:yg.week,n:yg.session&&yg.session.id==="s2"?2:1}),recKey:"hoy_rec_yoga",ctaKey:"hoy_cta_start",alts:hoyAlts(L,run,yg,stNeed,["yoga"])};
  }
  if(k==="strength"&&stNeed){
   const nm=st.day?dn(st.day).split("·")[0].trim():t("hoy_type_str");
   return {load:L,kind:"strength",title:nm,sub:t("hoy_sub_str"),recKey:"hoy_rec_str",ctaKey:"hoy_cta_start",alts:hoyAlts(L,run,yg,stNeed,["strength"])};
  }
 }
 return {load:L,kind:"mobility",presetId:"general10",title:t("hoy_type_mob"),sub:t("mob_gen10"),recKey:"hoy_rec_free",ctaKey:"hoy_cta_mob",alts:[{kind:"hub"}]};

function hoyAlts(L,run,yg,stNeed,skip){

 const bad=entries.filter(e=>e.rpe>=5||e.breath==="gasping"||e.legs==="heavy"||e.legs==="pain"||e.couldDoAnother===false||!e.completed);
 if(entries.some(e=>e.legs==="pain")) return "pain";
 if(bad.length) return "repeat";
 const good=entries.every(e=>e.completed&&e.rpe<=4&&(e.breath==="easy"||e.breath==="controlled")&&e.legs!=="pain"&&e.couldDoAnother===true);
 return good?"advance":"repeat";

}
function runUnlockAchievements(entry){

 const add=id=>{ if(!have.has(id)){ DB.runningAchievements.push({id,date:today()}); have.add(id); } };
 const hist=runProg().history||[];
 if(hist.length===1) add("first");
 if(runRequired(entry.week).every(s=>hist.some(h=>h.week===entry.week&&h.sessionId===s.id&&h.completed&&!h.repeat))) add("week_pair");
 const jog=runProg().jogSec||0;
 if(jog>=300) add("jog5"); if(jog>=600) add("jog10");
 if(entry.week>=9&&entry.completed) add("block5");
 if(entry.week>=12&&entry.completed&&entry.sessionId==="s1") add("cont20");
 if(entry.week>=14&&entry.completed) add("cont30");
 const km=+entry.km||0;
 if(km>=3) add("km3"); if(km>=5) add("km5"); if(km>=7) add("km7"); if(km>=10) add("km10"); if(km>=11) add("km12");
}
function runSaveFeedback(){

 const kmEl=document.getElementById("runKm"); if(kmEl){ const v=(kmEl.value||"").trim(); if(v) runFb.km=v; }
 const planned=runBuildSteps(s).reduce((a,x)=>a+(+x.sec||0),0);
 const extra=(s.cooldown?300:0);
 const elapsed=runLive.cutEarly?Math.max(1,Math.round((seqNow()-runLive.startedAt)/60000)):Math.max(1,Math.round((planned+extra)/60));
 const completed=!runLive.cutEarly && !!runLive.completedMain && (runLive.skippedSteps||0)<Math.max(2,(s.sets||1));
 const already=runIsRequiredDone(runLive.week,runLive.sessionId);
 const entry={
  type:"running",date:today(),week:runLive.week,sessionId:runLive.sessionId,
  durMin:elapsed,completed,rpe:+runFb.rpe,breath:runFb.breath,legs:runFb.legs,
  couldDoAnother:!!runFb.could,skippedSteps:runLive.skippedSteps||0,

 };
